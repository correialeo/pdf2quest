spring.application.name=pdf2questao

server.port=8080

spring.datasource.url=jdbc:sqlite:pdf2questao.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema versionado pelo Flyway (db/migration); rollbacks manuais em db/rollback.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# OCR das provas em PDF sem camada de texto (FCC)
pdf2questao.ocr.tesseract-path=tesseract
pdf2questao.ocr.language=por
pdf2questao.ocr.dpi=300
pdf2questao.ocr.cache-dir=data/ocr-cache
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

springdoc.swagger-ui.path=/swagger-ui.html
