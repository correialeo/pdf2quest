spring.application.name=pdf2questao

server.port=8080
# Sessao HTTP so por cookie (sem ;jsessionid= nas URLs dos redirects com mensagem).
server.servlet.session.tracking-modes=cookie

spring.datasource.url=jdbc:sqlite:pdf2questao.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema versionado pelo Flyway (db/migration); rollbacks manuais em db/rollback.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# OCR das provas em PDF sem camada de texto (FCC)
pdf2questao.ocr.tesseract-path=tesseract
pdf2questao.ocr.language=por
pdf2questao.ocr.dpi=300
pdf2questao.ocr.cache-dir=data/ocr-cache
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

springdoc.swagger-ui.path=/swagger-ui.html

# CSS/JS: o navegador confere com o servidor antes de usar a copia guardada; depois de atualizar o projeto,
# ninguem fica com um editor.js antigo em cache.
spring.web.resources.cache.cachecontrol.no-cache=true

# Revisao espacada: dias ate cada revisao (lembrou = avanca um; esqueceu = volta ao primeiro).
pdf2questao.revisao.intervalos=1,3,7,14,30
# Tempo da tarefa diaria de revisao (junta todos os assuntos a revisar no dia).
pdf2questao.revisao.minutos=25

# Servidor MCP para o Claude Code (Streamable HTTP em http://localhost:8080/mcp). Ferramentas em com.pdf2questao.mcp.
spring.ai.mcp.server.name=pdf2questao
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Sistema local de estudos para concursos do usuario. Tutor do dia: prompt rotina_estudo_do_dia (criar_aula, criar_quiz, adicionar_quiz, resultado_quiz, desempenho_quiz, listar_aulas). Novo quiz: prompt novo_quiz; sempre leia erros_quiz_anteriores antes de criar_quiz. Desempenho: desempenho_por_disciplina, resumo_de_erros, ultimo_simulado, historico_simulados, ver_resultado. Treino: listar_erros, registrar_treino (no fim, com as respostas do usuario). Simulado inedito: siga o prompt montar_simulado (ler_edital, estrutura_do_edital, salvar_perfil_edital, provas_da_banca, exemplos_da_banca, criar_simulado, adicionar_questoes, finalizar_simulado), pesquisando a banca na internet antes. Discursiva: criar_discursiva, ler_discursiva, corrigir_discursiva. Rotina: tarefas_de_hoje, concluir_tarefa, criar_tarefa, revisoes_de_hoje, marcar_revisao, anexar_ao_resumo_do_dia, buscar_paginas, ler_pagina.
