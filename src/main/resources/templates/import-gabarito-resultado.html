<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resultado da Importação de Gabarito')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <h1 class="mb-4">Resultado da Importação de Gabarito</h1>

    <div class="alert alert-danger" th:if="${result.errorMessage != null}" th:text="${result.errorMessage}"></div>

    <div class="card p-4 mb-4" th:if="${result.errorMessage == null}">
        <p><strong>Título buscado:</strong> <span th:text="${titulo}"></span></p>
        <p><strong>Respostas encontradas no gabarito:</strong>
            <span class="badge bg-secondary" th:text="${result.totalGabarito}"></span></p>
        <p><strong>Questões da importação:</strong>
            <span class="badge bg-secondary" th:text="${result.totalQuestions}"></span></p>
        <p><strong>Questões vinculadas com sucesso:</strong>
            <span class="badge bg-success" th:text="${result.matched}"></span></p>
        <p th:if="${!result.unmatchedQuestionNumbers.isEmpty()}">
            <strong>Questões sem correspondência no gabarito:</strong>
            <span class="badge bg-warning text-dark" th:text="${result.unmatchedQuestionNumbers}"></span>
        </p>
    </div>

    <a href="/import/gabarito" class="btn btn-secondary mt-3">Importar outro gabarito</a>
    <a href="/questoes" class="btn btn-primary mt-3">Ver questões</a>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
