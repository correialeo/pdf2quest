<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resultado da Importação')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <h1 class="mb-4">Resultado da Importação</h1>

    <div class="card p-4 mb-4">
        <p><strong>Arquivo:</strong> <span th:text="${job.fileName}"></span></p>
        <p><strong>Banca detectada:</strong> <span th:text="${job.detectedOrganization} ?: 'não detectada'"></span></p>
        <p><strong>Ano detectado:</strong> <span th:text="${job.detectedYear} ?: 'não detectado'"></span></p>
        <p><strong>Questões importadas:</strong>
            <span class="badge bg-success" th:text="${job.importedQuestions}"></span></p>
        <p><strong>Questões com falha:</strong>
            <span class="badge bg-danger" th:text="${job.failedQuestions}"></span></p>
    </div>

    <div class="card p-4" th:if="${job.errorLog != null and !job.errorLog.isBlank()}">
        <h5>Erros durante a importação</h5>
        <pre th:text="${job.errorLog}"></pre>
    </div>

    <a href="/import" class="btn btn-secondary mt-3">Importar outro PDF</a>
    <a href="/questoes" class="btn btn-primary mt-3">Ver questões</a>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
