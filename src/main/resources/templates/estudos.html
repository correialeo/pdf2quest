<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Hoje')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Hoje</h1>
            <p class="page-subtitle" th:text="${#temporals.format(today, 'EEEE, d ''de'' MMMM', new java.util.Locale('pt', 'BR'))}"></p>
        </div>
        <form method="post" action="/estudos/paginas">
            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova página</button>
        </form>
    </div>
    <nav th:replace="~{fragments/estudos :: tabs('overview')}"></nav>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="section-title d-flex align-items-center mt-0">
                <span>Para hoje</span>
                <span class="ms-auto d-flex align-items-center gap-3">
                    <th:block th:replace="~{fragments/estudos :: dayButton(${today}, ${todaySummary}, 'Resumo de hoje', '')}"></th:block>
                    <form th:if="${#lists.size(dueTasks.?[overdue and !review]) > 0}" method="post" action="/estudos/cronograma/atrasadas/hoje" class="d-inline">
                        <button type="submit" class="btn btn-link btn-sm p-0 fw-normal">Trazer atrasadas para hoje</button>
                    </form>
                    <a href="/estudos/cronograma" class="small fw-normal">Ver cronograma</a>
                </span>
            </div>
            <th:block th:if="${dueTasks.isEmpty()}"><div th:replace="~{fragments/ui :: empty('bi-calendar-check', 'Nada planejado para hoje.', 'Planejar uma tarefa', '/estudos/cronograma')}"></div></th:block>
            <div class="card task-list" th:unless="${dueTasks.isEmpty()}">
                <div class="task-row" th:each="t : ${dueTasks}" th:classappend="${t.overdue} ? 'is-overdue'">
                    <form th:replace="~{fragments/estudos :: taskCheck(${t})}"></form>
                    <div class="task-info">
                        <a class="text-reset text-decoration-none fw-medium" th:href="@{/estudos/cronograma/{id}/editar(id=${t.id})}" th:text="${t.title}"></a>
                        <div class="task-meta">
                            <span th:if="${t.overdue}" class="text-bad">Atrasada · <span th:text="${#temporals.format(t.plannedDate, 'dd/MM')}"></span></span>
                            <span th:if="${t.subject != null}" th:text="${t.subject}"></span>
                            <form th:replace="~{fragments/estudos :: taskTime(${t})}"></form>
                        </div>
                        <form th:replace="~{fragments/estudos :: taskDescription(${t})}"></form>
                        <ul class="review-items" th:if="${t.review and !t.done and !dueReviews.isEmpty()}">
                            <li th:each="r : ${dueReviews}">
                                <a class="text-reset" th:href="${r.pageId != null} ? @{/estudos/paginas/{id}(id=${r.pageId})} : @{/estudos/cronograma/{id}/editar(id=${r.id})}" th:text="${r.title}"></a>
                                <span class="text-muted" th:if="${r.subject != null}" th:text="'· ' + ${r.subject}"></span>
                                <form method="post" th:action="@{/estudos/cronograma/{id}/revisar(id=${r.id})}" class="d-inline">
                                    <button type="submit" name="lembrei" value="true" class="btn btn-link btn-sm p-0 ms-1 text-ok"
                                            title="Lembrei: sai da revisão de hoje e vai para o próximo intervalo">lembrei</button>
                                    <button type="submit" name="lembrei" value="false" class="btn btn-link btn-sm p-0 ms-1 text-bad"
                                            title="Esqueci: sai da revisão de hoje e volta amanhã">esqueci</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="row row-cols-3 g-3 mt-1">
                <div class="col"><div th:replace="~{fragments/ui :: stat('Tarefas da semana', ${week.done} + ' de ' + ${week.planned}, '')}"></div></div>
                <div class="col"><div th:replace="~{fragments/ui :: stat('Planejado na semana', ${week.estimatedMinutes} + ' min', '')}"></div></div>
                <div class="col"><div th:replace="~{fragments/ui :: stat('Estudado na semana', ${week.spentMinutes} + ' min', 'text-ok')}"></div></div>
            </div>
        </div>

        <div class="col-lg-5">
            <!-- Questoes: o que esta pela metade, o ultimo simulado e os erros esperando revisao. -->
            <div class="section-title d-flex align-items-center mt-0">
                <span>Questões</span>
                <a href="/dashboard" class="ms-auto small fw-normal">Desempenho</a>
            </div>
            <div class="card p-3 mb-2" th:each="o : ${practice.open}">
                <div class="d-flex align-items-center gap-2">
                    <div class="flex-grow-1 min-w-0">
                        <div class="fw-medium text-truncate" th:text="${o.label()}" th:title="${o.label()}"></div>
                        <div class="text-muted small" th:text="'Questão ' + ${o.resumeIndex + 1} + ' de ' + ${o.total()}"></div>
                    </div>
                    <a class="btn btn-primary btn-sm" th:href="@{/resolver/{id}(id=${o.session.id}, index=${o.resumeIndex})}">Continuar</a>
                </div>
            </div>
            <a class="card p-3 mb-2 text-reset text-decoration-none d-block" th:if="${practice.lastScore != null and practice.lastScore.projectedTotal != null}"
               th:href="@{/resultado/{id}(id=${practice.lastScored.id})}" th:with="sc=${practice.lastScore}">
                <div class="d-flex justify-content-between align-items-baseline gap-2">
                    <span class="stat-label">Último simulado · projeção</span>
                    <span class="badge" th:if="${sc.projectedPassed != null}" th:classappend="${sc.projectedPassed} ? 'text-bg-success' : 'text-bg-danger'"
                          th:text="${sc.projectedPassed} ? 'passa' : 'não passa'"></span>
                </div>
                <div class="fs-5 fw-semibold">
                    <span th:text="${#numbers.formatDecimal(sc.projectedTotal, 1, 1)}"></span>
                    <span class="text-muted fw-normal fs-6" th:text="'de ' + ${#numbers.formatDecimal(sc.maxTotal, 1, 0)}
                          + (${sc.minTotal != null} ? ' · mínimo ' + ${#numbers.formatDecimal(sc.minTotal, 1, 0)} : '')"></span>
                </div>
                <div class="text-muted small text-truncate" th:text="${practice.lastScored.blockName} + ' · ' + ${#temporals.format(practice.lastScored.finishedAt, 'dd/MM')}"></div>
            </a>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a class="btn btn-outline-secondary btn-sm" href="/caderno-erros" th:if="${practice.errors > 0}">
                    <i class="bi bi-journal-x me-1 text-bad"></i><span th:text="${practice.errors} + (${practice.errors == 1} ? ' erro para revisar' : ' erros para revisar')"></span></a>
                <a class="btn btn-outline-secondary btn-sm" href="/blocos"><i class="bi bi-stopwatch me-1"></i>Simulado</a>
                <a class="btn btn-outline-secondary btn-sm" href="/import/arquivo#treino"><i class="bi bi-chat-dots me-1"></i>Importar treino do Claude</a>
            </div>

            <div class="section-title d-flex align-items-center">
                <span>Anotação rápida</span>
                <a href="/estudos/caixa-de-entrada" class="ms-auto small fw-normal"
                   th:text="${inboxCount > 0} ? 'Caixa de entrada (' + ${inboxCount} + ')' : 'Caixa de entrada'"></a>
            </div>
            <form th:replace="~{fragments/estudos :: quickNote}"></form>

            <div class="section-title mt-4">Páginas recentes</div>
            <div th:if="${recentPages.isEmpty()}" class="empty-state">
                <i class="bi bi-file-earmark-text"></i>
                <span>Crie sua primeira página de resumo: use títulos, listas, tabelas e checklists.</span>
            </div>
            <div class="card page-list" th:unless="${recentPages.isEmpty()}">
                <a class="page-list-row" th:each="p : ${recentPages}" th:href="@{/estudos/paginas/{id}(id=${p.id})}">
                    <i class="bi bi-file-earmark-text text-muted"></i>
                    <span class="text-truncate" th:text="${p.displayTitle}"></span>
                    <span class="text-muted small ms-auto text-nowrap" th:text="${#temporals.format(p.updatedAt, 'dd/MM HH:mm')}"></span>
                </a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
