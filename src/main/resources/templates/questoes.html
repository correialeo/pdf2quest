<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Questões - Concursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Questões</h1>
    <p class="text-muted"><span th:text="${total}"></span> questões cadastradas no banco.</p>

    <form method="post" action="/questoes/iniciar" class="card p-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Disciplina</label>
                <select name="subject" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="s : ${subjects}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Assunto</label>
                <select name="topic" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="t : ${topics}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ano</label>
                <select name="year" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Banca</label>
                <select name="organization" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="o : ${organizations}" th:value="${o}" th:text="${o}"></option>
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantidade de questões</label>
            <input type="number" name="quantity" class="form-control" value="10" min="1" required/>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" name="keepExamOrder" value="true" id="keepExamOrder"/>
            <label class="form-check-label" for="keepExamOrder">
                Manter ordem original da prova (também agrupa por disciplina)
            </label>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar</button>
    </form>
</div>
</body>
</html>
