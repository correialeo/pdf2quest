<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questões da Prova')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1 th:text="${job.displayName}"></h1>
            <p class="page-subtitle" th:text="${questions.size()} + ' questões'"></p>
        </div>
        <div class="d-flex gap-2">
            <a th:if="${hasPdf}" th:href="@{/import/{id}/pdf(id=${job.id})}" target="_blank"
               class="btn btn-outline-secondary"><i class="bi bi-file-earmark-pdf me-1"></i>Abrir PDF</a>
            <form method="post" th:action="@{/import/{id}/simulado(id=${job.id})}" th:if="${!questions.isEmpty()}">
                <button type="submit" class="btn btn-primary"><i class="bi bi-play-fill me-1"></i>Resolver a prova</button>
            </form>
        </div>
    </div>

    <th:block th:each="q, it : ${questions}"
              th:with="passage=${q.passageId != null} ? ${passages[q.passageId]} : null,
                       firstOfPassage=${passage != null and (it.first or questions[it.index - 1].passageId != q.passageId)}">
        <div th:replace="~{fragments/ui :: question(${q}, 'Questão ' + ${q.questionNumber} + (${q.page != null} ? ' · pág. ' + ${q.page} : ''),
                 ${passage}, ${firstOfPassage}, null, null, true)}"></div>
    </th:block>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
