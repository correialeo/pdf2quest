<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Painel do bloco')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <a href="/dashboard" class="small">&larr; Dashboard</a>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3 mt-1">
        <div>
            <h1 class="mb-0" th:text="${b.block.name}"></h1>
            <div class="text-muted small"
                 th:text="${b.questions} + ' questões' + (${b.block.timeLimitMinutes != null} ? ' · ' + ${b.block.timeLimitMinutes} + ' min' : '')
                          + (${b.profileName != null} ? ' · perfil: ' + ${b.profileName} : '')"></div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/blocos/{id}(id=${b.block.id})}" class="btn btn-outline-secondary btn-sm">Ver bloco</a>
            <form method="post" th:action="@{/blocos/{id}/iniciar(id=${b.block.id})}">
                <button class="btn btn-success btn-sm" th:disabled="${b.questions == 0}">Iniciar sessão</button></form>
        </div>
    </div>

    <div class="card p-3">
        <p class="text-muted mb-0" th:if="${b.sessions.isEmpty()}">Nenhuma sessão finalizada deste bloco ainda.</p>
        <table class="table table-sm mb-0 align-middle" th:if="${!b.sessions.isEmpty()}">
            <thead><tr><th>Data</th><th>Acertos</th><th>Nota</th><th>Por grupo</th><th>Mínimos</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${b.sessions}">
                <td th:text="${#temporals.format(s.session.startedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${s.session.correctCount} + '/' + ${s.session.correctCount + s.session.wrongCount}"></td>
                <td th:text="${s.score != null} ? ${#numbers.formatDecimal(s.score.total, 1, 1)} + ' / ' + ${#numbers.formatDecimal(s.score.maxTotal, 1, 1)} : '-'"></td>
                <td>
                    <th:block th:if="${s.score != null}">
                        <span th:each="g : ${s.score.groups}" class="me-2 small"
                              th:text="${g.name} + ' ' + ${#numbers.formatDecimal(g.points, 1, 1)}"></span>
                    </th:block>
                </td>
                <td>
                    <span th:if="${s.score != null}" class="badge"
                          th:classappend="${s.score.passed} ? 'bg-success' : 'bg-danger'"
                          th:text="${s.score.passed} ? 'Bateu' : 'Não bateu'"></span>
                </td>
                <td><a th:href="@{/resultado/{id}(id=${s.session.id})}">ver</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
