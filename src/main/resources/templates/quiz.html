<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${quiz.title})}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page lesson-page">
    <a th:if="${lesson != null}" th:href="@{/aulas/{id}(id=${lesson.id})}" class="small text-muted text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i><span th:text="${lesson.title}"></span></a>
    <a th:if="${lesson == null}" href="/aulas" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Aulas</a>
    <div class="d-flex align-items-baseline justify-content-between gap-2 mt-1">
        <h1 class="m-0" th:text="${quiz.title}"></h1>
        <span class="small text-muted text-nowrap" id="quizScore"></span>
    </div>
    <p class="page-subtitle">
        <span th:if="${quiz.subject != null}" th:text="${quiz.subject}"></span>
        <span th:if="${quiz.topic != null}" th:text="' · ' + ${quiz.topic}"></span>
        <span th:if="${quiz.level != null}" th:text="' · nível ' + ${quiz.level}"></span>
        <span th:if="${task != null}"> · Tarefa: <a th:href="@{/estudos/cronograma/{id}/editar(id=${task.id})}" th:text="${task.title}"></a></span>
    </p>
    <div class="card p-3 mb-3 small" th:if="${quiz.doubts != null or (quiz.previousErrors != null and !quiz.previousErrors.isEmpty())}">
        <div th:if="${quiz.doubts != null}"><span class="fw-medium">Suas dúvidas:</span> <span th:text="${quiz.doubts}"></span></div>
        <div th:if="${quiz.previousErrors != null and !quiz.previousErrors.isEmpty()}" class="text-muted">
            <span class="fw-medium">Retoma erros anteriores:</span> <span class="essay-prompt" th:text="${quiz.previousErrors}"></span></div>
    </div>

    <!-- Clicar numa alternativa responde: ela fica verde/vermelha com o porque; se errou, a correta aparece.
         Depois de responder, clicar nas outras mostra a explicacao delas. -->
    <div class="card p-4 mb-3 quiz-question" th:each="q : ${questions}" th:attr="data-id=${q.id},data-topic=${q.topic},data-correct=${answers[q.id] != null} ? ${q.correctAnswer} : '',data-selected=${answers[q.id] != null} ? ${answers[q.id].selectedAnswer} : '',data-answer=${q.correctAnswer}">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span class="small text-muted" th:text="${q.position} + ' de ' + ${questions.size()} + (${q.topic != null} ? ' · ' + ${q.topic} : '')"></span>
            <button type="button" class="btn-copy" data-copy="question" title="Copiar questão" aria-label="Copiar questão"><i class="bi bi-clipboard"></i></button>
        </div>
        <div class="quiz-statement" th:text="${q.statement}"></div>
        <div class="quiz-options">
            <button type="button" class="quiz-option" th:each="a : ${q.alternativeList()}" th:attr="data-letter=${a.letra}">
                <span class="alt-letter" th:text="${a.letra}"></span>
                <span class="quiz-option-body">
                    <span th:text="${a.texto}"></span>
                    <span class="quiz-why" hidden th:text="${a.explicacao}"></span>
                    <span class="btn-copy copy-answer" role="button" tabindex="0" data-copy="answer" title="Copiar resposta" aria-label="Copiar resposta"><i class="bi bi-clipboard-check"></i></span>
                </span>
            </button>
        </div>
    </div>
    <!-- Fim do quiz: resultado, o que errou e o proximo passo (concluir a tarefa, outro quiz, proxima tarefa). -->
    <section class="card p-4 mb-3 quiz-done" id="quizDone" hidden>
        <div class="d-flex align-items-baseline gap-2 flex-wrap">
            <h2 class="h4 m-0">Quiz concluído</h2>
            <span class="fs-5 fw-semibold" id="quizDoneScore"></span>
        </div>
        <p class="small text-muted mb-2" id="quizDoneTopics"></p>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <th:block th:if="${task != null and !task.done}">
                <form th:replace="~{fragments/estudos :: taskDoneButton(${task})}"></form>
            </th:block>
            <span class="small text-ok" th:if="${task != null and task.done}"><i class="bi bi-check-circle-fill me-1"></i>Tarefa concluída</span>
            <a class="btn btn-outline-primary btn-sm" th:if="${nextQuiz != null}" th:href="@{/quizzes/{id}(id=${nextQuiz.id})}">
                Próximo quiz: <span th:text="${nextQuiz.title}"></span></a>
            <a class="btn btn-outline-secondary btn-sm" th:if="${next != null}" th:href="${next.link}"
               th:title="${next.task.title}">Próxima de hoje: <span class="text-truncate d-inline-block align-bottom" style="max-width: 16rem" th:text="${next.task.title}"></span></a>
            <a class="btn btn-link btn-sm" th:if="${lesson != null}" th:href="@{/aulas/{id}(id=${lesson.id})}">Voltar à aula</a>
            <button th:replace="~{fragments/ui :: askClaude('fiz o quiz ' + ${quiz.id} + ': corrija minhas dúvidas e agende o reforço do que errei', 'Copiar pedido de correção')}"></button>
        </div>
    </section>

    <div class="d-flex justify-content-between align-items-center">
        <span class="small text-muted">Atalhos: <kbd>A</kbd>–<kbd>E</kbd> respondem a pergunta atual, <kbd>Enter</kbd> vai para a próxima.</span>
        <form method="post" th:action="@{/quizzes/{id}/refazer(id=${quiz.id})}">
            <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise me-1"></i>Refazer</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:inline="javascript">
    const quizId = /*[[${quiz.id}]]*/ 0;
    const cards = Array.from(document.querySelectorAll('.quiz-question'));

    function questionText(card) {
        const lines = [card.querySelector('.quiz-statement').textContent.trim(), ''];
        card.querySelectorAll('.quiz-option').forEach(function (opt) {
            lines.push(opt.dataset.letter + ') ' + opt.querySelector('.quiz-option-body > span').textContent.trim());
        });
        return lines.join('\n');
    }

    function answerText(card, opt) {
        const correct = opt.dataset.letter === card.dataset.answer;
        const body = opt.querySelector('.quiz-option-body');
        const why = body.querySelector('.quiz-why').textContent.trim();
        return (correct ? 'Gabarito: ' : 'Alternativa incorreta: ') + opt.dataset.letter + ') ' + body.querySelector('span').textContent.trim() + (why ? '\n\n' + why : '');
    }

    cards.forEach(function (card) {
        card.querySelectorAll('[data-copy]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const text = btn.dataset.copy === 'question' ? questionText(card) : answerText(card, btn.closest('.quiz-option'));
                const label = btn.innerHTML;
                navigator.clipboard.writeText(text).then(function () {
                    btn.innerHTML = '<i class="bi bi-check2"></i>';
                    setTimeout(function () { btn.innerHTML = label; }, 1500);
                });
            });
        });
    });

    function score() {
        const done = cards.filter(c => c.dataset.selected);
        const right = done.filter(c => c.dataset.selected === c.dataset.correct).length;
        document.getElementById('quizScore').textContent = done.length === 0 ? cards.length + ' perguntas'
            : right + ' de ' + done.length + ' certas' + (done.length < cards.length ? ' · ' + (cards.length - done.length) + ' faltando' : '');
        const panel = document.getElementById('quizDone');
        const finished = cards.length > 0 && done.length === cards.length;
        const wasHidden = panel.hidden;
        panel.hidden = !finished;
        if (finished) {
            document.getElementById('quizDoneScore').textContent = right + ' de ' + cards.length + ' certas ('
                + Math.round(right * 100 / cards.length) + '%)';
            const wrong = [...new Set(done.filter(c => c.dataset.selected !== c.dataset.correct)
                .map(c => c.dataset.topic).filter(t => t))];
            document.getElementById('quizDoneTopics').textContent = right === cards.length ? 'Gabaritou!'
                : (wrong.length ? 'Para reforçar: ' + wrong.join(', ') + '.' : 'Revise as perguntas em vermelho.');
            if (wasHidden && current !== null) { panel.scrollIntoView({behavior: 'smooth', block: 'center'}); }
        }
        markCurrent();
    }

    // Pergunta atual (a primeira sem resposta) para os atalhos de teclado.
    let current = null;
    let fromKeyboard = false;
    function markCurrent() {
        const first = cards.find(c => !c.dataset.selected) || null;
        cards.forEach(c => c.classList.toggle('is-current', c === first));
        current = first;
    }

    document.addEventListener('keydown', function (e) {
        const t = e.target;
        if (e.ctrlKey || e.metaKey || e.altKey || t.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName)) return;
        if (document.querySelector('dialog[open]')) return;
        const key = e.key.toUpperCase();
        if (current && /^[A-E]$/.test(key)) {
            const opt = current.querySelector('.quiz-option[data-letter="' + key + '"]');
            if (opt) { e.preventDefault(); fromKeyboard = true; opt.click(); }
        } else if (e.key === 'Enter' && current) {
            e.preventDefault();
            current.scrollIntoView({behavior: 'smooth', block: 'center'});
        }
    });

    /** Mostra o resultado: a escolhida (certa/errada) com o porquê e a correta destacada. */
    function reveal(card) {
        const selected = card.dataset.selected, correct = card.dataset.correct;
        card.classList.add('is-answered');
        card.querySelectorAll('.quiz-option').forEach(function (opt) {
            const letter = opt.dataset.letter;
            opt.classList.toggle('is-correct', letter === correct);
            opt.classList.toggle('is-wrong', letter === selected && selected !== correct);
            opt.classList.toggle('is-open', letter === selected || letter === correct);
            opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
        });
    }

    cards.forEach(function (card) {
        if (card.dataset.selected) { reveal(card); }
        card.querySelectorAll('.quiz-option').forEach(function (opt) {
            opt.addEventListener('click', function () {
                if (card.dataset.selected) {
                    opt.classList.toggle('is-open');
                    opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
                    return;
                }
                if (card.dataset.sending) { return; }
                card.dataset.sending = '1';
                fetch('/quizzes/' + quizId + '/responder', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({questionId: Number(card.dataset.id), selected: opt.dataset.letter})
                }).then(function (r) {
                    if (!r.ok) { throw new Error(r.status); }
                    return r.json();
                }).then(function (res) {
                    card.dataset.selected = opt.dataset.letter;
                    card.dataset.correct = res.correctAnswer;
                    reveal(card);
                    score();
                    if (current && fromKeyboard) {
                        setTimeout(function () { current.scrollIntoView({behavior: 'smooth', block: 'center'}); }, 600);
                    }
                    fromKeyboard = false;
                }).catch(function () {
                    window.p2qToast('Não foi possível salvar a resposta. Tente de novo.', 'danger');
                }).finally(function () { delete card.dataset.sending; });
            });
        });
    });
    score();
</script>
</body>
</html>
