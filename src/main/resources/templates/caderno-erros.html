<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Caderno de Erros')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Caderno de erros</h1>
            <p class="page-subtitle">Questões que você errou na última vez que respondeu. Acertando ao refazer, elas saem daqui.</p>
        </div>
        <form method="post" action="/caderno-erros/refazer" th:if="${!questions.isEmpty()}">
            <input type="hidden" name="prova" th:value="${selectedProva}"/>
            <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i>Refazer
                <span th:text="${questions.size()}"></span></button>
        </form>
    </div>
    <div class="chip-row" th:if="${provas.size() > 0}">
        <a href="/caderno-erros" class="chip" th:classappend="${selectedProva == null} ? 'active'"
           th:text="'Todas · ' + ${totalErrors}"></a>
        <a th:each="j : ${provas}" th:href="@{/caderno-erros(prova=${j.id})}" class="chip"
           th:classappend="${selectedProva != null and selectedProva == j.id} ? 'active'" th:title="${j.displayName}"
           th:text="${j.displayName} + ' · ' + ${perProva[j.id]}"></a>
    </div>
    <div th:if="${questions.isEmpty()}"
         th:replace="~{fragments/ui :: empty('bi-emoji-smile', 'Nenhuma questão pendente de revisão. Bom trabalho!', null, null)}"></div>
    <th:block th:each="q : ${questions}">
        <div th:replace="~{fragments/ui :: question(${q}, ${q.questionNumber != null} ? 'Questão ' + ${q.questionNumber} : 'Questão', null, false, null, ${wrongAnswers[q.id]}, false)}"></div>
    </th:block>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
