<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Caderno de Erros')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Caderno de Erros</h1>
        <form method="post" action="/caderno-erros/refazer" th:if="${!questions.isEmpty()}">
            <button type="submit" class="btn btn-primary">Refazer todas (<span th:text="${questions.size()}"></span>)</button>
        </form>
    </div>

    <p class="text-muted" th:if="${questions.isEmpty()}">Nenhuma questão pendente de revisão. Bom trabalho!</p>

    <div class="card p-3 mb-3" th:each="q : ${questions}">
        <p class="mb-1"><strong th:text="${q.subject} ?: 'Sem disciplina'"></strong>
            <span class="text-muted" th:if="${q.organization != null}"> — <span th:text="${q.organization}"></span></span>
            <span class="text-muted" th:if="${q.year != null}"> — <span th:text="${q.year}"></span></span>
        </p>
        <p class="rich-text" th:utext="${@richText.html(q.statement)}"></p>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
