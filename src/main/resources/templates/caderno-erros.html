<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Caderno de Erros')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Caderno de Erros</h1>
        <form method="post" action="/caderno-erros/refazer" th:if="${!questions.isEmpty()}">
            <input type="hidden" name="prova" th:value="${selectedProva}"/>
            <button type="submit" class="btn btn-primary">Refazer todas (<span th:text="${questions.size()}"></span>)</button>
        </form>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3" th:if="${provas.size() > 0}">
        <a href="/caderno-erros" class="btn btn-sm"
           th:classappend="${selectedProva == null} ? 'btn-primary' : 'btn-outline-secondary'"
           th:text="'Todas (' + ${totalErrors} + ')'"></a>
        <a th:each="j : ${provas}" th:href="@{/caderno-erros(prova=${j.id})}" class="btn btn-sm"
           th:classappend="${selectedProva != null and selectedProva == j.id} ? 'btn-primary' : 'btn-outline-secondary'"
           th:text="${j.displayName} + ' (' + ${perProva[j.id]} + ')'"></a>
    </div>

    <p class="text-muted" th:if="${questions.isEmpty()}">Nenhuma questão pendente de revisão. Bom trabalho!</p>

    <div class="card p-3 mb-3" th:each="q : ${questions}">
        <p class="mb-1"><strong th:text="${q.subject} ?: 'Sem disciplina'"></strong>
            <span class="text-muted" th:if="${q.organization != null}"> — <span th:text="${q.organization}"></span></span>
            <span class="text-muted" th:if="${q.year != null}"> — <span th:text="${q.year}"></span></span>
        </p>
        <p class="rich-text" th:utext="${@richText.html(q.statement)}"></p>
        <p class="mb-1 alternative" th:if="${q.alternativeA != null}"
           th:classappend="${wrongAnswers[q.id] == 'A'} ? 'alternative-wrong'">
            <strong>A)</strong> <span class="rich-text" th:utext="${@richText.html(q.alternativeA)}"></span>
            <span class="badge bg-danger ms-1" th:if="${wrongAnswers[q.id] == 'A'}">Sua resposta</span>
        </p>
        <p class="mb-1 alternative" th:if="${q.alternativeB != null}"
           th:classappend="${wrongAnswers[q.id] == 'B'} ? 'alternative-wrong'">
            <strong>B)</strong> <span class="rich-text" th:utext="${@richText.html(q.alternativeB)}"></span>
            <span class="badge bg-danger ms-1" th:if="${wrongAnswers[q.id] == 'B'}">Sua resposta</span>
        </p>
        <p class="mb-1 alternative" th:if="${q.alternativeC != null}"
           th:classappend="${wrongAnswers[q.id] == 'C'} ? 'alternative-wrong'">
            <strong>C)</strong> <span class="rich-text" th:utext="${@richText.html(q.alternativeC)}"></span>
            <span class="badge bg-danger ms-1" th:if="${wrongAnswers[q.id] == 'C'}">Sua resposta</span>
        </p>
        <p class="mb-1 alternative" th:if="${q.alternativeD != null}"
           th:classappend="${wrongAnswers[q.id] == 'D'} ? 'alternative-wrong'">
            <strong>D)</strong> <span class="rich-text" th:utext="${@richText.html(q.alternativeD)}"></span>
            <span class="badge bg-danger ms-1" th:if="${wrongAnswers[q.id] == 'D'}">Sua resposta</span>
        </p>
        <p class="mb-1 alternative" th:if="${q.alternativeE != null}"
           th:classappend="${wrongAnswers[q.id] == 'E'} ? 'alternative-wrong'">
            <strong>E)</strong> <span class="rich-text" th:utext="${@richText.html(q.alternativeE)}"></span>
            <span class="badge bg-danger ms-1" th:if="${wrongAnswers[q.id] == 'E'}">Sua resposta</span>
        </p>
        <p class="text-muted rich-text" th:if="${q.note != null}" th:text="'Observação: ' + ${q.note}"></p>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
