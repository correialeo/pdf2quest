<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Importar PDF - Concursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Importar Prova (PDF)</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="post" action="/import" enctype="multipart/form-data" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Arquivo PDF</label>
            <input type="file" name="file" accept="application/pdf" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Cargo/Prova (opcional)</label>
            <input type="text" name="exam" class="form-control" placeholder="Ex: Analista Técnico"/>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Banca (opcional — sobrepõe detecção automática)</label>
                <input type="text" name="organizationOverride" class="form-control"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ano (opcional — sobrepõe detecção automática)</label>
                <input type="number" name="yearOverride" class="form-control"/>
            </div>
        </div>
        <p class="text-muted">
            Banca, ano, disciplina e categoria (Conhecimentos Gerais/Específicos) são detectados
            automaticamente a partir do próprio texto da prova. "Assunto" não é detectado e pode
            ser preenchido depois na tela de Questões.
        </p>
        <button type="submit" class="btn btn-primary">Importar</button>
    </form>
</div>
</body>
</html>
