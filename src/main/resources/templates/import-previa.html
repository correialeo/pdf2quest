<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Prévia da importação')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Prévia da importação</h1>
            <p class="page-subtitle" th:text="${preview.fileName} + ' · nada foi gravado ainda.'"></p>
        </div>
        <a th:if="${csvToken != null}" th:href="@{/import/csv/{t}(t=${csvToken})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Mudar as colunas</a>
    </div>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <div class="alert alert-danger" th:unless="${preview.fileErrors.isEmpty()}">
        <div class="fw-medium mb-1">Não foi possível ler o arquivo:</div>
        <ul class="mb-0"><li th:each="e : ${preview.fileErrors}" th:text="${e}"></li></ul>
    </div>
    <div class="alert alert-warning" th:unless="${preview.fileWarnings.isEmpty()}">
        <ul class="mb-0 small"><li th:each="w : ${preview.fileWarnings}" th:text="${w}"></li></ul>
    </div>

    <th:block th:if="${preview.fileErrors.isEmpty()}">
    <div class="row row-cols-2 row-cols-md-5 g-3 mb-3">
        <div class="col"><div th:replace="~{fragments/ui :: stat('Novas', ${preview.newCount}, 'text-ok')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Já cadastradas (mesmo ID)', ${preview.existingCount}, '')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Possíveis duplicatas', ${preview.duplicateCount}, ${preview.duplicateCount > 0} ? 'text-guess' : '')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Com erro', ${preview.invalidCount}, ${preview.invalidCount > 0} ? 'text-bad' : '')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Sem resposta', ${preview.withoutAnswerCount}, '')}"></div></div>
    </div>

    <form method="post" th:action="@{/import/previa/{t}/confirmar(t=${preview.token})}" class="card p-3 mb-4" th:if="${preview.importable}">
        <input type="hidden" name="csv" th:value="${csvToken}" th:if="${csvToken != null}"/>
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label small">Nome da prova na lista de provas</label>
                <input type="text" name="title" class="form-control" th:value="${preview.title}" th:placeholder="${preview.fileName}"/>
            </div>
        </div>
        <div class="mt-3 d-flex flex-column gap-1">
            <div class="form-check" th:if="${preview.existingCount > 0}">
                <input class="form-check-input" type="checkbox" name="updateExisting" value="true" id="updateExisting"/>
                <label class="form-check-label" for="updateExisting">
                    Atualizar as <strong th:text="${preview.existingCount}"></strong> questões que já estão cadastradas com o mesmo ID
                    <span class="text-muted small">(desmarcado: elas ficam como estão; respostas e sessões anteriores são mantidas)</span></label>
            </div>
            <div class="form-check" th:if="${preview.duplicateCount > 0}">
                <input class="form-check-input" type="checkbox" name="includeDuplicates" value="true" id="includeDuplicates"/>
                <label class="form-check-label" for="includeDuplicates">
                    Importar mesmo assim as <strong th:text="${preview.duplicateCount}"></strong> possíveis duplicatas
                    <span class="text-muted small">(desmarcado: não entram)</span></label>
            </div>
            <div class="form-check" th:if="${preview.invalidCount > 0}">
                <input class="form-check-input" type="checkbox" name="acceptInvalid" value="true" id="acceptInvalid" required/>
                <label class="form-check-label" for="acceptInvalid">
                    Entendi: as <strong th:text="${preview.invalidCount}"></strong> questões com erro <strong>não</strong> serão importadas
                    <span class="text-muted small">(ou corrija o arquivo e envie de novo)</span></label>
            </div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Confirmar importação</button>
            <button type="submit" class="btn btn-outline-secondary" formnovalidate
                    th:formaction="@{/import/previa/{t}/cancelar(t=${preview.token})}">Desistir</button>
        </div>
    </form>
    <div class="alert alert-danger" th:unless="${preview.importable}">Nenhuma questão pode ser importada. Corrija os erros abaixo e envie o arquivo de novo.</div>

    <div class="d-flex flex-wrap gap-2 mb-2 preview-filter" role="group" aria-label="Filtrar">
        <button type="button" class="btn btn-sm btn-outline-secondary active" data-filter="">Todas</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="INVALIDA" th:if="${preview.invalidCount > 0}">Com erro</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="POSSIVEL_DUPLICATA" th:if="${preview.duplicateCount > 0}">Possíveis duplicatas</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="JA_EXISTE" th:if="${preview.existingCount > 0}">Já cadastradas</button>
    </div>
    <div class="card preview-list">
        <div class="preview-row" th:each="item : ${preview.items}" th:attr="data-status=${item.status}">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="fw-medium" th:text="${item.source.label}"></span>
                <span th:switch="${item.status.name()}">
                    <span th:case="'NOVA'" class="badge text-bg-success">nova</span>
                    <span th:case="'JA_EXISTE'" class="badge text-bg-secondary">já cadastrada</span>
                    <span th:case="'POSSIVEL_DUPLICATA'" class="badge text-bg-warning">possível duplicata</span>
                    <span th:case="'INVALIDA'" class="badge text-bg-danger">com erro</span>
                </span>
                <code class="small" th:if="${item.source.externalId != null}" th:text="${item.source.externalId}"></code>
                <span class="text-muted small" th:if="${item.type != null}"
                      th:text="${item.type.name() == 'CERTO_ERRADO'} ? 'Certo/Errado' : (${item.alternatives.size()} + ' alternativas')"></span>
                <span class="small" th:if="${item.answer != null}" th:text="'Resposta: ' + ${item.answer}"></span>
                <span class="small" th:if="${item.source.annulled}">Anulada</span>
                <span class="text-muted small ms-auto" th:text="${#strings.defaultString(item.source.subject, '')}"></span>
            </div>
            <div class="small mt-1 text-truncate-2" th:text="${#strings.abbreviate(item.source.statement, 220)} ?: '(sem enunciado)'"></div>
            <ul class="small text-bad mb-0 mt-1" th:unless="${item.errors.isEmpty()}"><li th:each="e : ${item.errors}" th:text="${e}"></li></ul>
            <div class="small text-guess mt-1" th:if="${item.duplicateOf != null}" th:text="'Enunciado igual ao da ' + ${item.duplicateOf} + '.'"></div>
            <ul class="small text-muted mb-0 mt-1" th:unless="${item.warnings.isEmpty()}"><li th:each="w : ${item.warnings}" th:text="${w}"></li></ul>
        </div>
    </div>
    </th:block>
    <a href="/import/arquivo" class="btn btn-outline-secondary mt-3" th:unless="${preview.fileErrors.isEmpty()}">Enviar outro arquivo</a>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    document.querySelectorAll('.preview-filter [data-filter]').forEach(function (button) {
        button.addEventListener('click', function () {
            var filter = button.getAttribute('data-filter');
            document.querySelectorAll('.preview-filter .active').forEach(function (b) { b.classList.remove('active'); });
            button.classList.add('active');
            document.querySelectorAll('.preview-row').forEach(function (row) {
                row.hidden = filter !== '' && row.getAttribute('data-status') !== filter;
            });
        });
    });
</script>
</body>
</html>
