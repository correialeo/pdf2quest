<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Painel da prova')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <a href="/dashboard" class="small">&larr; Dashboard</a>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3 mt-1">
        <div>
            <h1 class="mb-0" th:text="${p.job.displayName}"></h1>
            <div class="text-muted small"
                 th:text="${p.job.banca} + (${p.job.detectedYear != null} ? ' · ' + ${p.job.detectedYear} : '') + ' · ' + ${p.job.fileName}"></div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/import/{id}/questoes(id=${p.job.id})}" class="btn btn-outline-secondary btn-sm">Ver questões</a>
            <a th:href="@{/import/result/{id}(id=${p.job.id})}" class="btn btn-outline-secondary btn-sm">Dados e relatório</a>
            <form method="post" th:action="@{/import/{id}/bloco(id=${p.job.id})}">
                <button class="btn btn-outline-primary btn-sm">Criar bloco desta prova</button></form>
            <form method="post" th:action="@{/import/{id}/simulado(id=${p.job.id})}">
                <button class="btn btn-success btn-sm">Iniciar simulado</button></form>
        </div>
    </div>

    <div class="row row-cols-2 row-cols-md-6 g-3 mb-4">
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Questões</div><div class="fs-4" th:text="${p.totalQuestions}"></div></div></div>
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Resolvidas</div>
            <div class="fs-4" th:text="${p.answered} + ' (' + ${#numbers.formatDecimal(p.coverage(), 1, 0)} + '%)'"></div></div></div>
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Acertos / erros</div>
            <div class="fs-4"><span class="text-success" th:text="${p.correct}"></span> /
                <span class="text-danger" th:text="${p.wrong}"></span></div></div></div>
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Aproveitamento</div>
            <div class="fs-4" th:text="${#numbers.formatDecimal(p.percent(), 1, 1)} + '%'"></div></div></div>
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Caderno de erros</div>
            <div class="fs-4"><a th:href="@{/caderno-erros(prova=${p.job.id})}" th:text="${p.errors}"></a></div></div></div>
        <div class="col"><div class="card p-3 text-center">
            <div class="text-muted small">Acertos no chute</div>
            <div class="fs-4"><a class="text-warning" th:href="@{/chutes(prova=${p.job.id})}" th:text="${p.guess.guessCorrect}"></a></div></div></div>
    </div>

    <div class="alert alert-warning" th:if="${p.needsReview > 0}"
         th:text="${p.needsReview} + ' questões desta prova estão marcadas para revisão (leitura incerta do PDF). Veja o relatório em Dados e relatório.'"></div>

    <h5>Por disciplina</h5>
    <div class="card p-3 mb-4">
        <div th:each="s : ${p.subjects}" class="mb-3">
            <div class="d-flex justify-content-between">
                <span th:text="${s.label}"></span>
                <span class="text-muted small"
                      th:text="${s.answered} + '/' + ${s.questions} + ' resolvidas'
                               + (${s.correct + s.wrong > 0} ? ' · ' + ${#numbers.formatDecimal(s.percent(), 1, 0)} + '% de acerto (' + ${s.correct} + '/' + ${s.correct + s.wrong} + ')' : '')"></span>
            </div>
            <div class="progress" style="height: 10px">
                <div class="progress-bar" th:classappend="${s.percent() >= 70} ? 'bg-success' : (${s.percent() >= 50} ? 'bg-warning' : 'bg-danger')"
                     th:style="'width: ' + ${s.percent()} + '%'"></div>
            </div>
        </div>
    </div>

    <h5 th:if="${!p.topics.isEmpty()}">Por assunto</h5>
    <div class="card p-3 mb-4" th:if="${!p.topics.isEmpty()}">
        <div th:each="s : ${p.topics}" class="mb-2">
            <div class="d-flex justify-content-between small">
                <span th:text="${s.label}"></span>
                <span th:text="${#numbers.formatDecimal(s.percent(), 1, 1)} + '% (' + ${s.correct} + '/' + ${s.total} + ')'"></span>
            </div>
            <div class="progress" style="height: 6px"><div class="progress-bar bg-info" th:style="'width: ' + ${s.percent()} + '%'"></div></div>
        </div>
    </div>

    <h5>Sessões que usaram questões desta prova</h5>
    <div class="card p-3">
        <p class="text-muted mb-0" th:if="${p.sessions.isEmpty()}">Nenhuma ainda.</p>
        <table class="table table-sm mb-0" th:if="${!p.sessions.isEmpty()}">
            <thead><tr><th>Data</th><th>Sessão</th><th>Acertos nesta prova</th><th>Aproveitamento</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${p.sessions}">
                <td th:text="${#temporals.format(r.session.startedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${r.label()}"></td>
                <td th:text="${r.correct} + '/' + ${r.correct + r.wrong}"></td>
                <td th:text="${#numbers.formatDecimal(r.percent(), 1, 1)} + '%'"></td>
                <td><a th:if="${r.session.finishedAt != null}" th:href="@{/resultado/{id}(id=${r.session.id})}">ver</a>
                    <span th:unless="${r.session.finishedAt != null}" class="text-muted small">em andamento</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
