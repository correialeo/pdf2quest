<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resolver')}"></head>
<body class="focus-mode">
<!-- Modo foco: sem menu lateral. Barra do topo com saida, progresso, tempo e mapa de questoes. -->
<header class="focus-bar">
    <a href="/dashboard" class="icon-btn" title="Sair (a sessão continua aberta)" aria-label="Sair"><i class="bi bi-x-lg"></i></a>
    <div class="focus-title">
        <span class="fw-medium text-truncate" th:text="${studySession.blockName} ?: ${studySession.mode}"
              th:title="${studySession.blockName}"></span>
        <span class="text-muted small text-nowrap" th:text="${index + 1} + ' / ' + ${total}"></span>
    </div>
    <span class="focus-timer" id="countdown" th:if="${remainingSeconds != null}"></span>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#questionMap"
            aria-expanded="false" aria-controls="questionMap" title="Mapa de questões (M)" id="mapToggle">
        <i class="bi bi-grid-3x3-gap me-1"></i>Questões</button>
    <button type="button" class="icon-btn theme-toggle" aria-label="Alternar tema claro/escuro">
        <i class="bi bi-moon icon-moon"></i><i class="bi bi-sun icon-sun"></i></button>
    <div class="focus-progress"><div th:style="'width: ' + ${answered.size() * 100 / total} + '%'"></div></div>
</header>

<nav class="collapse question-map-wrap" id="questionMap" aria-label="Mapa de questões">
    <div class="question-map">
        <a th:each="qid, st : ${questionIds}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${st.index})}"
           th:text="${st.count}"
           th:classappend="${(st.index == index ? 'current ' : '') + (answered.contains(qid) ? 'done' : '')}"
           th:title="${answered.contains(qid)} ? 'Respondida' : 'Sem resposta'"></a>
    </div>
    <div class="question-map-legend"><span class="done"></span>respondida <span></span>sem resposta</div>
</nav>

<main class="page resolver-page" th:classappend="${passage != null} ? 'container-xxl' : 'container'">
    <div class="d-flex flex-wrap gap-2 mb-3" th:if="${passage != null or hasPdf}">
        <!-- Celular: o texto base abre/fecha acima da questao. Tablet em diante ele ja fica ao lado. -->
        <button th:if="${passage != null}" type="button" class="btn btn-sm btn-outline-secondary d-md-none"
                data-bs-toggle="collapse" data-bs-target="#passagePanel" aria-expanded="false"
                aria-controls="passagePanel"><i class="bi bi-file-text me-1"></i>Ver texto base</button>
        <button th:if="${passage != null}" type="button" class="btn btn-sm btn-outline-secondary d-none d-md-inline-block"
                id="togglePassage" aria-controls="passagePanel" aria-pressed="false">Ocultar texto base</button>
        <a th:if="${hasPdf}" class="btn btn-sm btn-outline-secondary" target="_blank"
           th:href="@{/import/{id}/pdf(id=${question.importJobId})} + (${question.page != null} ? '#page=' + ${question.page} : '')">
            <i class="bi bi-file-earmark-pdf me-1"></i><span th:text="${question.page != null} ? 'PDF da prova (pág. ' + ${question.page} + ')' : 'PDF da prova'"></span></a>
    </div>

    <div class="split-layout" id="splitLayout" th:classappend="${passage != null} ? 'has-passage'">
    <aside th:if="${passage != null}" id="passagePanel" class="passage-panel collapse d-md-block"
           th:attr="data-passage-id=${passage.id}" aria-label="Texto base">
        <div class="card p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h6 class="text-muted small mb-0">Texto base</h6>
                <span class="d-flex gap-1 passage-tools">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="highlightSelection"
                            title="Grifa o trecho selecionado (no computador, basta selecionar)"><i class="bi bi-highlighter me-1"></i>Grifar</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="clearHighlights"
                            title="Remove todos os grifos deste texto">Limpar</button>
                </span>
            </div>
            <div class="form-text mb-2">Selecione um trecho para grifar. Selecione de novo dentro do grifo para tirá-lo.</div>
            <div class="rich-text" id="passageText" th:utext="${@richText.html(passage.content)}"></div>
        </div>
    </aside>

    <section class="question-panel">
        <div class="question-meta" th:if="${question.subject != null}" th:text="${question.subject}"></div>
        <div class="question-statement rich-text" th:utext="${@richText.html(question.statement)}"></div>

        <div class="alternatives">
            <label class="alternative" th:each="alt : ${question.alternatives()}" th:attr="data-letter=${alt.key}"
                   th:for="'opt' + ${alt.key}">
                <input class="answer-option visually-hidden" type="radio" name="answer" th:value="${alt.key}" th:id="'opt' + ${alt.key}"
                       th:checked="${attempt != null and attempt.selectedAnswer == alt.key}"/>
                <span class="alt-letter" th:text="${alt.key}"></span>
                <span class="alt-text rich-text" th:utext="${@richText.html(alt.value)}"></span>
                <button type="button" class="strike-toggle" title="Riscar alternativa (Shift + letra)"
                        aria-label="Riscar alternativa"><i class="bi bi-slash-circle"></i></button>
            </label>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-3 mt-3">
            <label class="guess-chip" for="guessCheck">
                <input type="checkbox" id="guessCheck" class="visually-hidden"
                       th:checked="${attempt != null and attempt.guessed == true}"/>
                <i class="bi bi-question-diamond"></i>É chute? <kbd>X</kbd>
            </label>
            <span id="saveStatus" class="form-text m-0"></span>
        </div>
        <div class="form-text">Marque se não tinha certeza. Se acertar assim, a questão entra no seu diagnóstico de chutes.</div>

        <div th:replace="~{fragments/question-tools :: tools(${question})}"></div>
    </section>
    </div>
</main>

<!-- Rodape fixo: navegacao sempre no mesmo lugar, independente do tamanho da questao. -->
<footer class="focus-footer">
    <a th:if="${hasPrevious}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index - 1})}"
       class="btn btn-outline-secondary" id="prevLink"><i class="bi bi-arrow-left me-1"></i>Anterior</a>
    <span th:unless="${hasPrevious}"></span>
    <span class="text-muted small d-none d-md-inline shortcuts">
        <kbd>A</kbd>–<kbd>E</kbd> responde · <kbd>Shift</kbd>+letra risca · <kbd>X</kbd> chute · <kbd>M</kbd> mapa · <kbd>←</kbd><kbd>→</kbd> navega</span>
    <a th:if="${hasNext}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index + 1})}"
       class="btn btn-primary" id="nextLink">Próxima<i class="bi bi-arrow-right ms-1"></i></a>
    <form th:unless="${hasNext}" method="post" th:action="@{/resolver/{id}/finalizar(id=${studySession.id})}"
          id="finishForm">
        <button type="submit" class="btn btn-success"><i class="bi bi-check2 me-1"></i>Finalizar</button>
    </form>
</footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script src="/js/passage-highlight.js"></script>
<script th:inline="javascript">
    const sessionId = /*[[${studySession.id}]]*/ 0;
    const questionId = /*[[${question.id}]]*/ 0;
    const startTime = Date.now();

    // Tempo limite do bloco: contagem regressiva; ao zerar apenas avisa (a sessao nao e encerrada sozinha).
    const remainingSeconds = /*[[${remainingSeconds}]]*/ null;
    if (remainingSeconds !== null) {
        const deadline = Date.now() + remainingSeconds * 1000;
        const badge = document.getElementById('countdown');
        const tick = function () {
            const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
            const m = Math.floor(left / 60), s = left % 60;
            badge.textContent = left === 0 ? 'Tempo esgotado' : m + ':' + String(s).padStart(2, '0');
            if (left === 0) { clearInterval(timer); }
        };
        const timer = setInterval(tick, 1000);
        tick();
    }

    // Texto base ao lado da questao (tablet em diante): lembra se foi ocultado e onde parou de ler,
    // para trocar de questao do mesmo texto sem perder o lugar.
    (function () {
        const panel = document.getElementById('passagePanel');
        if (!panel) { return; }
        const layout = document.getElementById('splitLayout');
        const toggle = document.getElementById('togglePassage');
        const scrollKey = 'passageScroll:' + sessionId + ':' + panel.getAttribute('data-passage-id');
        const hiddenKey = 'passageHidden';

        function applyHidden(hidden) {
            layout.classList.toggle('passage-hidden', hidden);
            toggle.textContent = hidden ? 'Mostrar texto base' : 'Ocultar texto base';
            toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
        }
        applyHidden(localStorage.getItem(hiddenKey) === '1');
        toggle.addEventListener('click', function () {
            const hidden = !layout.classList.contains('passage-hidden');
            localStorage.setItem(hiddenKey, hidden ? '1' : '0');
            applyHidden(hidden);
        });

        // Grifo do texto base: um por sessao e texto, guardado no navegador.
        const highlighter = PassageHighlight.init(document.getElementById('passageText'),
            'passageHl:' + sessionId + ':' + panel.getAttribute('data-passage-id'));
        const hlButton = document.getElementById('highlightSelection');
        // mousedown: o clique no botao nao pode desfazer a selecao antes de grifar.
        [hlButton, document.getElementById('clearHighlights')].forEach(function (b) {
            b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        });
        hlButton.addEventListener('click', function () { highlighter.apply(); });
        document.getElementById('clearHighlights').addEventListener('click', function () {
            if (highlighter.ranges().length === 0 || confirm('Remover todos os grifos deste texto?')) {
                highlighter.clear();
            }
        });

        panel.scrollTop = parseInt(sessionStorage.getItem(scrollKey) || '0', 10);
        panel.addEventListener('scroll', function () {
            sessionStorage.setItem(scrollKey, String(panel.scrollTop));
        });
    })();

    // Alternativas riscadas ficam so no navegador: sao rascunho da resolucao, nao resposta.
    const strikeKey = 'strike:' + sessionId + ':' + questionId;
    const struck = new Set(JSON.parse(localStorage.getItem(strikeKey) || '[]'));

    document.querySelectorAll('.alternative').forEach(function (alt) {
        const letter = alt.getAttribute('data-letter');
        const toggle = alt.querySelector('.strike-toggle');
        function render() {
            const on = struck.has(letter);
            alt.classList.toggle('alternative-struck', on);
            toggle.title = on ? 'Desfazer risco (Shift + letra)' : 'Riscar alternativa (Shift + letra)';
        }
        toggle.addEventListener('click', function (e) {
            e.preventDefault();   // o botao fica dentro do label: nao pode marcar a alternativa
            struck.has(letter) ? struck.delete(letter) : struck.add(letter);
            localStorage.setItem(strikeKey, JSON.stringify(Array.from(struck)));
            render();
        });
        render();
    });

    // Salva a resposta junto com o "E chute?"; marcar o chute depois de responder salva de novo a mesma resposta.
    const guessCheck = document.getElementById('guessCheck');
    function save() {
        const chosen = document.querySelector('.answer-option:checked');
        if (!chosen) {
            return;   // sem resposta ainda: o estado do chute vai junto com a primeira resposta
        }
        fetch('/resolver/' + sessionId + '/responder', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                questionId: questionId,
                selectedAnswer: chosen.value,
                elapsedMillis: Date.now() - startTime,
                guess: guessCheck.checked
            })
        }).then(function (response) {
            if (!response.ok) { throw new Error(response.status); }
            showStatus('Resposta salva.', 'text-ok');
            const current = document.querySelector('.question-map a.current');
            if (current) { current.classList.add('done'); }
        }).catch(function () {
            showStatus('Falha ao salvar a resposta. Escolha a alternativa de novo para tentar outra vez.', 'text-bad fw-semibold');
        });
    }
    function showStatus(text, cls) {
        const status = document.getElementById('saveStatus');
        status.className = 'form-text m-0 ' + cls;
        status.textContent = text;
    }
    document.querySelectorAll('.answer-option').forEach(function (el) {
        el.addEventListener('change', save);
    });
    guessCheck.addEventListener('change', save);

    // Finalizar com questoes em branco pede confirmacao (a desta tela conta se acabou de ser respondida).
    const finishForm = document.getElementById('finishForm');
    if (finishForm) {
        finishForm.addEventListener('submit', function (e) {
            const pending = document.querySelectorAll('.question-map a:not(.done)').length;
            if (pending > 0 && !confirm(pending + (pending === 1 ? ' questão sem resposta' : ' questões sem resposta')
                    + '. Finalizar mesmo assim?')) {
                e.preventDefault();
            }
        });
    }

    // Atalhos: A-E responde, Shift+letra risca, X marca chute, M abre o mapa, setas navegam (e nao trocam o radio focado).
    // Ignorados enquanto se digita (observacao) ou com Ctrl/Cmd/Alt, para nao brigar com o navegador.
    document.addEventListener('keydown', function (e) {
        const t = e.target;
        if (e.ctrlKey || e.metaKey || e.altKey || t.isContentEditable
                || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) && t.type !== 'radio' && t.type !== 'checkbox') {
            return;
        }
        const key = e.key.toUpperCase();
        const alt = document.querySelector('.alternative[data-letter="' + key + '"]');
        if (alt) {
            e.preventDefault();
            if (e.shiftKey) {
                alt.querySelector('.strike-toggle').click();
            } else {
                const radio = alt.querySelector('.answer-option');
                radio.checked = true;
                radio.focus();
                radio.dispatchEvent(new Event('change'));
            }
        } else if (key === 'M') {
            e.preventDefault();
            document.getElementById('mapToggle').click();
        } else if (key === 'X') {
            e.preventDefault();
            guessCheck.checked = !guessCheck.checked;
            guessCheck.dispatchEvent(new Event('change'));
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const link = document.getElementById(e.key === 'ArrowRight' ? 'nextLink' : 'prevLink');
            if (link) { link.click(); }
        }
    });
</script>
</body>
</html>
