<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resolver - Concursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Questão <span th:text="${index + 1}"></span> de <span th:text="${total}"></span></h4>
        <span class="badge bg-secondary" th:text="${studySession.mode}"></span>
    </div>

    <div class="card p-4 mb-3">
        <p class="mb-4" style="white-space: pre-line;" th:text="${question.statement}"></p>

        <div class="form-check mb-2" th:if="${question.alternativeA != null}">
            <input class="form-check-input answer-option" type="radio" name="answer" value="A" id="optA"/>
            <label class="form-check-label" for="optA"><strong>A)</strong> <span th:text="${question.alternativeA}"></span></label>
        </div>
        <div class="form-check mb-2" th:if="${question.alternativeB != null}">
            <input class="form-check-input answer-option" type="radio" name="answer" value="B" id="optB"/>
            <label class="form-check-label" for="optB"><strong>B)</strong> <span th:text="${question.alternativeB}"></span></label>
        </div>
        <div class="form-check mb-2" th:if="${question.alternativeC != null}">
            <input class="form-check-input answer-option" type="radio" name="answer" value="C" id="optC"/>
            <label class="form-check-label" for="optC"><strong>C)</strong> <span th:text="${question.alternativeC}"></span></label>
        </div>
        <div class="form-check mb-2" th:if="${question.alternativeD != null}">
            <input class="form-check-input answer-option" type="radio" name="answer" value="D" id="optD"/>
            <label class="form-check-label" for="optD"><strong>D)</strong> <span th:text="${question.alternativeD}"></span></label>
        </div>
        <div class="form-check mb-2" th:if="${question.alternativeE != null}">
            <input class="form-check-input answer-option" type="radio" name="answer" value="E" id="optE"/>
            <label class="form-check-label" for="optE"><strong>E)</strong> <span th:text="${question.alternativeE}"></span></label>
        </div>

        <div id="saveStatus" class="form-text mt-2"></div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:if="${hasPrevious}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index - 1})}" class="btn btn-outline-secondary">Anterior</a>
        <span th:unless="${hasPrevious}"></span>

        <a th:if="${hasNext}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index + 1})}" class="btn btn-outline-secondary">Próxima</a>
        <form th:unless="${hasNext}" method="post" th:action="@{/resolver/{id}/finalizar(id=${studySession.id})}">
            <button type="submit" class="btn btn-success">Finalizar</button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const sessionId = /*[[${studySession.id}]]*/ 0;
    const questionId = /*[[${question.id}]]*/ 0;
    const startTime = Date.now();

    document.querySelectorAll('.answer-option').forEach(function (el) {
        el.addEventListener('change', function () {
            const elapsed = Date.now() - startTime;
            fetch('/resolver/' + sessionId + '/responder', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    questionId: questionId,
                    selectedAnswer: el.value,
                    elapsedMillis: elapsed
                })
            }).then(function () {
                document.getElementById('saveStatus').textContent = 'Resposta salva.';
            });
        });
    });
</script>
</body>
</html>
