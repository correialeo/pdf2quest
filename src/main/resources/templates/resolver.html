<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resolver')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="page" th:classappend="${passage != null} ? 'container-xxl' : 'container'">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h4 class="mb-0 text-nowrap">Questão <span th:text="${index + 1}"></span> de <span th:text="${total}"></span></h4>
        <span class="d-flex flex-wrap align-items-center gap-1 header-badges">
            <span class="badge bg-warning text-dark" id="countdown" th:if="${remainingSeconds != null}"></span>
            <span class="badge bg-secondary badge-truncate" th:if="${studySession.blockName != null}"
                  th:text="${studySession.blockName}" th:title="${studySession.blockName}"></span>
            <span class="badge bg-secondary" th:text="${studySession.mode}"></span>
        </span>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-2" th:if="${passage != null or hasPdf}">
        <!-- Celular: o texto base abre/fecha acima da questao. Tablet em diante ele ja fica ao lado. -->
        <button th:if="${passage != null}" type="button" class="btn btn-sm btn-outline-primary d-md-none"
                data-bs-toggle="collapse" data-bs-target="#passagePanel" aria-expanded="false"
                aria-controls="passagePanel">Ver texto base</button>
        <button th:if="${passage != null}" type="button" class="btn btn-sm btn-outline-secondary d-none d-md-inline-block"
                id="togglePassage" aria-controls="passagePanel" aria-pressed="false">Ocultar texto base</button>
        <a th:if="${hasPdf}" class="btn btn-sm btn-outline-secondary" target="_blank"
           th:href="@{/import/{id}/pdf(id=${question.importJobId})} + (${question.page != null} ? '#page=' + ${question.page} : '')"
           th:text="${question.page != null} ? 'Abrir PDF da prova (pág. ' + ${question.page} + ')' : 'Abrir PDF da prova'"></a>
    </div>

    <div class="split-layout" id="splitLayout" th:classappend="${passage != null} ? 'has-passage'">
    <aside th:if="${passage != null}" id="passagePanel" class="passage-panel collapse d-md-block"
           th:attr="data-passage-id=${passage.id}" aria-label="Texto base">
        <div class="card p-4">
            <h6 class="text-uppercase text-muted small mb-3">Texto base</h6>
            <div class="rich-text" th:utext="${@richText.html(passage.content)}"></div>
        </div>
    </aside>

    <section class="question-panel">
    <div class="card p-4 mb-3">
        <p class="mb-4 rich-text" th:utext="${@richText.html(question.statement)}"></p>

        <div class="form-check mb-2 alternative" th:if="${question.alternativeA != null}" data-letter="A">
            <input class="form-check-input answer-option" type="radio" name="answer" value="A" id="optA"
                   th:checked="${attempt != null and attempt.selectedAnswer == 'A'}"/>
            <label class="form-check-label" for="optA"><strong>A)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeA)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeB != null}" data-letter="B">
            <input class="form-check-input answer-option" type="radio" name="answer" value="B" id="optB"
                   th:checked="${attempt != null and attempt.selectedAnswer == 'B'}"/>
            <label class="form-check-label" for="optB"><strong>B)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeB)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeC != null}" data-letter="C">
            <input class="form-check-input answer-option" type="radio" name="answer" value="C" id="optC"
                   th:checked="${attempt != null and attempt.selectedAnswer == 'C'}"/>
            <label class="form-check-label" for="optC"><strong>C)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeC)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeD != null}" data-letter="D">
            <input class="form-check-input answer-option" type="radio" name="answer" value="D" id="optD"
                   th:checked="${attempt != null and attempt.selectedAnswer == 'D'}"/>
            <label class="form-check-label" for="optD"><strong>D)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeD)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeE != null}" data-letter="E">
            <input class="form-check-input answer-option" type="radio" name="answer" value="E" id="optE"
                   th:checked="${attempt != null and attempt.selectedAnswer == 'E'}"/>
            <label class="form-check-label" for="optE"><strong>E)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeE)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>

        <div class="guess-check form-check mt-3">
            <input class="form-check-input" type="checkbox" id="guessCheck"
                   th:checked="${attempt != null and attempt.guessed == true}"/>
            <label class="form-check-label" for="guessCheck">É chute?</label>
            <div class="form-text">Marque se não tinha certeza. Se acertar assim, a questão entra no seu diagnóstico de chutes.</div>
        </div>

        <div id="saveStatus" class="form-text mt-2"></div>
        <div th:replace="~{fragments/question-tools :: tools(${question})}"></div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:if="${hasPrevious}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index - 1})}" class="btn btn-outline-secondary">Anterior</a>
        <span th:unless="${hasPrevious}"></span>

        <a th:if="${hasNext}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index + 1})}" class="btn btn-outline-secondary">Próxima</a>
        <form th:unless="${hasNext}" method="post" th:action="@{/resolver/{id}/finalizar(id=${studySession.id})}">
            <button type="submit" class="btn btn-success">Finalizar</button>
        </form>
    </div>
    </section>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:inline="javascript">
    const sessionId = /*[[${studySession.id}]]*/ 0;
    const questionId = /*[[${question.id}]]*/ 0;
    const startTime = Date.now();

    // Tempo limite do bloco: contagem regressiva; ao zerar apenas avisa (a sessao nao e encerrada sozinha).
    const remainingSeconds = /*[[${remainingSeconds}]]*/ null;
    if (remainingSeconds !== null) {
        const deadline = Date.now() + remainingSeconds * 1000;
        const badge = document.getElementById('countdown');
        const tick = function () {
            const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
            const m = Math.floor(left / 60), s = left % 60;
            badge.textContent = left === 0 ? 'Tempo esgotado' : m + ':' + String(s).padStart(2, '0');
            if (left === 0) { clearInterval(timer); }
        };
        const timer = setInterval(tick, 1000);
        tick();
    }

    // Texto base ao lado da questao (tablet em diante): lembra se foi ocultado e onde parou de ler,
    // para trocar de questao do mesmo texto sem perder o lugar.
    (function () {
        const panel = document.getElementById('passagePanel');
        if (!panel) { return; }
        const layout = document.getElementById('splitLayout');
        const toggle = document.getElementById('togglePassage');
        const scrollKey = 'passageScroll:' + sessionId + ':' + panel.getAttribute('data-passage-id');
        const hiddenKey = 'passageHidden';

        function applyHidden(hidden) {
            layout.classList.toggle('passage-hidden', hidden);
            toggle.textContent = hidden ? 'Mostrar texto base' : 'Ocultar texto base';
            toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
        }
        applyHidden(localStorage.getItem(hiddenKey) === '1');
        toggle.addEventListener('click', function () {
            const hidden = !layout.classList.contains('passage-hidden');
            localStorage.setItem(hiddenKey, hidden ? '1' : '0');
            applyHidden(hidden);
        });

        panel.scrollTop = parseInt(sessionStorage.getItem(scrollKey) || '0', 10);
        panel.addEventListener('scroll', function () {
            sessionStorage.setItem(scrollKey, String(panel.scrollTop));
        });
    })();

    // Alternativas riscadas ficam so no navegador: sao rascunho da resolucao, nao resposta.
    const strikeKey = 'strike:' + sessionId + ':' + questionId;
    const struck = new Set(JSON.parse(localStorage.getItem(strikeKey) || '[]'));

    document.querySelectorAll('.alternative').forEach(function (alt) {
        const letter = alt.getAttribute('data-letter');
        const toggle = alt.querySelector('.strike-toggle');
        function render() {
            const on = struck.has(letter);
            alt.classList.toggle('alternative-struck', on);
            toggle.textContent = on ? 'desfazer' : 'riscar';
        }
        toggle.addEventListener('click', function () {
            struck.has(letter) ? struck.delete(letter) : struck.add(letter);
            localStorage.setItem(strikeKey, JSON.stringify(Array.from(struck)));
            render();
        });
        render();
    });

    // Salva a resposta junto com o "E chute?"; marcar o chute depois de responder salva de novo a mesma resposta.
    const guessCheck = document.getElementById('guessCheck');
    function save() {
        const chosen = document.querySelector('.answer-option:checked');
        if (!chosen) {
            return;   // sem resposta ainda: o estado do chute vai junto com a primeira resposta
        }
        fetch('/resolver/' + sessionId + '/responder', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                questionId: questionId,
                selectedAnswer: chosen.value,
                elapsedMillis: Date.now() - startTime,
                guess: guessCheck.checked
            })
        }).then(function () {
            document.getElementById('saveStatus').textContent = 'Resposta salva.';
        });
    }
    document.querySelectorAll('.answer-option').forEach(function (el) {
        el.addEventListener('change', save);
    });
    guessCheck.addEventListener('change', save);
</script>
</body>
</html>
