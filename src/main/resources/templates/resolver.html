<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resolver')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Questão <span th:text="${index + 1}"></span> de <span th:text="${total}"></span></h4>
        <span class="badge bg-secondary" th:text="${studySession.mode}"></span>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-2" th:if="${passage != null or hasPdf}">
        <button th:if="${passage != null}" type="button" class="btn btn-sm btn-outline-primary"
                data-bs-toggle="modal" data-bs-target="#passageModal">Ver texto base</button>
        <a th:if="${hasPdf}" class="btn btn-sm btn-outline-secondary" target="_blank"
           th:href="@{/import/{id}/pdf(id=${question.importJobId})} + (${question.page != null} ? '#page=' + ${question.page} : '')"
           th:text="${question.page != null} ? 'Abrir PDF da prova (pág. ' + ${question.page} + ')' : 'Abrir PDF da prova'"></a>
    </div>

    <div class="card p-4 mb-3">
        <p class="mb-4 rich-text" th:utext="${@richText.html(question.statement)}"></p>

        <div class="form-check mb-2 alternative" th:if="${question.alternativeA != null}" data-letter="A">
            <input class="form-check-input answer-option" type="radio" name="answer" value="A" id="optA"/>
            <label class="form-check-label" for="optA"><strong>A)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeA)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeB != null}" data-letter="B">
            <input class="form-check-input answer-option" type="radio" name="answer" value="B" id="optB"/>
            <label class="form-check-label" for="optB"><strong>B)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeB)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeC != null}" data-letter="C">
            <input class="form-check-input answer-option" type="radio" name="answer" value="C" id="optC"/>
            <label class="form-check-label" for="optC"><strong>C)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeC)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeD != null}" data-letter="D">
            <input class="form-check-input answer-option" type="radio" name="answer" value="D" id="optD"/>
            <label class="form-check-label" for="optD"><strong>D)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeD)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>
        <div class="form-check mb-2 alternative" th:if="${question.alternativeE != null}" data-letter="E">
            <input class="form-check-input answer-option" type="radio" name="answer" value="E" id="optE"/>
            <label class="form-check-label" for="optE"><strong>E)</strong> <span class="rich-text" th:utext="${@richText.html(question.alternativeE)}"></span></label>
            <button type="button" class="btn btn-link btn-sm p-0 ms-2 strike-toggle" title="Riscar alternativa">riscar</button>
        </div>

        <div id="saveStatus" class="form-text mt-2"></div>
        <div th:replace="~{fragments/question-tools :: tools(${question})}"></div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:if="${hasPrevious}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index - 1})}" class="btn btn-outline-secondary">Anterior</a>
        <span th:unless="${hasPrevious}"></span>

        <a th:if="${hasNext}" th:href="@{/resolver/{id}(id=${studySession.id}, index=${index + 1})}" class="btn btn-outline-secondary">Próxima</a>
        <form th:unless="${hasNext}" method="post" th:action="@{/resolver/{id}/finalizar(id=${studySession.id})}">
            <button type="submit" class="btn btn-success">Finalizar</button>
        </form>
    </div>
</main>

<div th:if="${passage != null}" class="modal fade" id="passageModal" tabindex="-1" aria-labelledby="passageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="passageModalLabel">Texto base</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body rich-text" th:utext="${@richText.html(passage.content)}"></div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:inline="javascript">
    const sessionId = /*[[${studySession.id}]]*/ 0;
    const questionId = /*[[${question.id}]]*/ 0;
    const startTime = Date.now();

    // Alternativas riscadas ficam so no navegador: sao rascunho da resolucao, nao resposta.
    const strikeKey = 'strike:' + sessionId + ':' + questionId;
    const struck = new Set(JSON.parse(localStorage.getItem(strikeKey) || '[]'));

    document.querySelectorAll('.alternative').forEach(function (alt) {
        const letter = alt.getAttribute('data-letter');
        const toggle = alt.querySelector('.strike-toggle');
        function render() {
            const on = struck.has(letter);
            alt.classList.toggle('alternative-struck', on);
            toggle.textContent = on ? 'desfazer' : 'riscar';
        }
        toggle.addEventListener('click', function () {
            struck.has(letter) ? struck.delete(letter) : struck.add(letter);
            localStorage.setItem(strikeKey, JSON.stringify(Array.from(struck)));
            render();
        });
        render();
    });

    document.querySelectorAll('.answer-option').forEach(function (el) {
        el.addEventListener('change', function () {
            const elapsed = Date.now() - startTime;
            fetch('/resolver/' + sessionId + '/responder', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    questionId: questionId,
                    selectedAnswer: el.value,
                    elapsedMillis: elapsed
                })
            }).then(function () {
                document.getElementById('saveStatus').textContent = 'Resposta salva.';
            });
        });
    });
</script>
</body>
</html>
