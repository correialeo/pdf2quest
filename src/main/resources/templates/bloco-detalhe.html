<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bloco')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1 th:text="${block.name}"></h1>
            <p class="page-subtitle" th:if="${block.description != null}" th:text="${block.description}"></p>
            <div class="block-meta mt-1">
                <span th:if="${block.timeLimitMinutes != null}"><i class="bi bi-stopwatch"></i> <span th:text="${block.timeLimitMinutes} + ' min'"></span></span>
                <span th:if="${profile != null}"><i class="bi bi-sliders"></i> <span th:text="${profile}"></span></span>
                <span th:if="${!exclusions.isBlank()}" th:text="'Exclusões: ' + ${exclusions}"></span>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/blocos/{id}/editar(id=${block.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil me-1"></i>Editar</a>
            <a th:if="${openSession}" th:href="@{/blocos/{id}/continuar(id=${block.id})}" class="btn btn-primary">Continuar sessão</a>
            <form method="post" th:action="@{/blocos/{id}/iniciar(id=${block.id})}">
                <button type="submit" class="btn" th:classappend="${openSession} ? 'btn-outline-secondary' : 'btn-primary'"
                        th:disabled="${preview.total == 0}"><i class="bi bi-play-fill me-1"></i><span th:text="${openSession} ? 'Nova sessão' : 'Iniciar sessão'"></span></button>
            </form>
        </div>
    </div>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <div th:replace="~{fragments/block-preview :: preview(${preview})}"></div>

    <div class="section-title" th:if="${preview.total > 0}">Questões do bloco</div>
    <th:block th:each="q, it : ${preview.questions}"
              th:with="passage=${q.passageId != null} ? ${passages[q.passageId]} : null,
                       firstOfPassage=${passage != null and (it.first or preview.questions[it.index - 1].passageId != q.passageId)}">
        <div th:replace="~{fragments/ui :: question(${q}, ${it.count} + '. Questão ' + ${q.questionNumber}, ${passage}, ${firstOfPassage}, null, null, false)}"></div>
    </th:block>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
