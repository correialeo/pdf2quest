<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${lesson.title})}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page lesson-page">
    <a href="/aulas" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Aulas</a>
    <h1 class="mt-1" th:text="${lesson.title}"></h1>
    <p class="page-subtitle">
        <span th:if="${lesson.subject != null}" th:text="${lesson.subject}"></span>
        <span th:if="${lesson.editalTopic != null}" th:text="' · Edital: ' + ${lesson.editalTopic}"></span>
        <span th:if="${task != null}"> · Tarefa: <a th:href="@{/estudos/cronograma/{id}/editar(id=${task.id})}" th:text="${task.title}"></a></span>
    </p>

    <div class="mb-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="copyLesson"><i class="bi bi-clipboard me-1"></i>Copiar aula</button>
    </div>
    <textarea id="lessonMarkdown" hidden th:text="${lesson.content}"></textarea>

    <article class="card p-4 rich-text lesson-content" th:if="${slides.isEmpty()}" th:utext="${contentHtml}"></article>

    <!-- Aula em slides: uma pagina por assunto, com questoes de fixacao no meio (respondidas aqui mesmo). -->
    <section class="lesson-deck" th:unless="${slides.isEmpty()}" th:attr="data-quiz=${fixation != null} ? ${fixation.id} : ''">
        <nav class="lesson-deck-tabs" aria-label="Slides">
            <button type="button" class="lesson-deck-tab" th:each="s, it : ${slides}" th:attr="data-slide=${it.index}"
                    th:text="${s.title}"></button>
        </nav>
        <article class="card p-4 rich-text lesson-content lesson-slide" th:each="s, it : ${slides}"
                 th:attr="data-slide=${it.index}" th:hidden="${it.index > 0}">
            <div class="small text-muted mb-1" th:text="'Slide ' + ${it.count} + ' de ' + ${slides.size()}"></div>
            <h2 class="h3" th:text="${s.title}"></h2>
            <th:block th:each="p : ${s.parts}">
                <div th:if="${p.html != null}" th:utext="${p.html}"></div>
                <div class="quiz-question lesson-question" th:if="${p.question != null and fixationQuestions[p.question] != null}"
                     th:with="q=${fixationQuestions[p.question]}, a=${fixationAnswers[fixationQuestions[p.question].id]}"
                     th:attr="data-id=${q.id},data-correct=${a != null} ? ${q.correctAnswer} : '',data-selected=${a != null} ? ${a.selectedAnswer} : ''">
                    <div class="small text-muted mb-1"><i class="bi bi-pencil-square me-1"></i>Fixação<span th:if="${q.topic != null}" th:text="' · ' + ${q.topic}"></span></div>
                    <div class="quiz-statement" th:utext="${@richText.html(q.statement)}"></div>
                    <div class="quiz-options">
                        <button type="button" class="quiz-option" th:each="alt : ${q.alternativeList()}" th:attr="data-letter=${alt.letra}">
                            <span class="alt-letter" th:text="${alt.letra}"></span>
                            <span class="quiz-option-body">
                                <span th:utext="${@richText.html(alt.texto)}"></span>
                                <span class="quiz-why" hidden th:text="${alt.explicacao}"></span>
                            </span>
                        </button>
                    </div>
                </div>
            </th:block>
        </article>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="slidePrev"><i class="bi bi-arrow-left me-1"></i>Anterior</button>
            <span class="small text-muted" id="deckScore"></span>
            <button type="button" class="btn btn-primary btn-sm" id="slideNext">Próximo<i class="bi bi-arrow-right ms-1"></i></button>
        </div>
        <div class="small text-muted mt-1">Atalhos: <kbd>←</kbd> <kbd>→</kbd> mudam de slide.</div>
    </section>

    <!-- Proximo passo depois de ler: fazer o quiz, concluir a tarefa ou seguir para a proxima de hoje. -->
    <section class="card p-3 mt-3 next-step">
        <div class="small text-muted mb-2">Próximo passo</div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a class="btn btn-primary btn-sm" th:if="${pendingQuiz != null}" th:href="@{/quizzes/{id}(id=${pendingQuiz.id})}">
                <i class="bi bi-ui-checks me-1"></i>Fazer o quiz: <span th:text="${pendingQuiz.title}"></span></a>
            <th:block th:if="${quizzes.isEmpty()}"><button th:replace="~{fragments/ui :: askClaude('cria um quiz da aula ' + ${lesson.id} + (${concursoAtivo != null} ? ' do concurso ' + ${concursoAtivo.nome} : ''), 'Copiar pedido de quiz')}"></button></th:block>
            <th:block th:if="${task != null and !task.done}">
                <form th:replace="~{fragments/estudos :: taskDoneButton(${task})}"></form>
            </th:block>
            <span class="small text-ok" th:if="${task != null and task.done}"><i class="bi bi-check-circle-fill me-1"></i>Tarefa concluída</span>
            <a class="btn btn-outline-secondary btn-sm" th:if="${next != null}" th:href="${next.link}" th:title="${next.task.title}">
                Próxima de hoje: <span class="text-truncate d-inline-block align-bottom" style="max-width: 16rem" th:text="${next.task.title}"></span></a>
        </div>
    </section>

    <!-- Quizzes da aula: cada um em sua tela; peca outro ao Claude (nivel, duvidas; ele retoma os erros). -->
    <section class="mt-4">
        <h2 class="h4">Quizzes</h2>
        <div class="empty-state" th:if="${quizzes.isEmpty()}">
            <i class="bi bi-ui-checks"></i><span>Esta aula ainda não tem quiz. Copie o pedido acima e cole no Claude Code.</span>
        </div>
        <div class="card page-list" th:unless="${quizzes.isEmpty()}">
            <a class="page-list-row" th:each="q : ${quizzes}" th:href="@{/quizzes/{id}(id=${q.id})}" th:with="r=${results[q.id]}">
                <i class="bi bi-ui-checks text-muted"></i>
                <span class="text-truncate"><span th:text="${q.title}"></span>
                    <span class="text-muted small" th:if="${q.level != null}" th:text="' · ' + ${q.level}"></span></span>
                <span class="ms-auto small text-nowrap" th:classappend="${r.concluido} ? 'text-ok' : 'text-guess'"
                      th:text="${r.concluido} ? ${r.acertos} + ' de ' + ${r.perguntas} + ' certas' : (${r.respondidas} > 0 ? ${r.respondidas} + ' de ' + ${r.perguntas} + ' respondidas' : ${r.perguntas} + ' perguntas')"></span>
            </a>
        </div>
        <div class="mt-2" th:unless="${quizzes.isEmpty()}">
            <button th:replace="~{fragments/ui :: askClaude('cria outro quiz da aula ' + ${lesson.id} + ', nível avançado, com foco em ', 'Copiar pedido de outro quiz')}"></button>
        </div>
    </section>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    document.getElementById('copyLesson').addEventListener('click', function () {
        const btn = this;
        const label = btn.innerHTML;
        const text = '# ' + document.querySelector('h1').textContent.trim() + '\n\n' + document.getElementById('lessonMarkdown').value;
        navigator.clipboard.writeText(text).then(function () {
            btn.innerHTML = '<i class="bi bi-check2 me-1"></i>Copiado';
            setTimeout(function () { btn.innerHTML = label; }, 1500);
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        // Seleciona blocos que podem conter a tabela: parágrafos e blocos de código (em todos os slides)
        const blocks = Array.from(document.querySelectorAll('.lesson-content p, .lesson-content pre'));
    
        blocks.forEach(function(block) {
            // Evita processar blocos que já estão dentro de uma tabela
            if (block.closest('table')) return;
    
            let rawHtml = block.innerHTML;
    
            // Converte <br> em quebras de linha reais para a detecção
            let textWithBreaks = rawHtml.replace(/<br\s*\/?>/gi, '\n');
    
            // Para <pre>, o textContent já preserva as quebras
            if (block.tagName === 'PRE') {
                textWithBreaks = block.textContent;
            }
    
            // Remove as tags HTML restantes para analisar o texto puro
            // (mantém os ** do Markdown, que serão convertidos depois)
            let plain = textWithBreaks.replace(/<[^>]*>/g, '');
    
            const lines = plain.split('\n')
                .map(function(l) { return l.trim(); })
                .filter(function(l) { return l.length > 0; });
    
            // Precisa de pelo menos: cabeçalho + separador + 1 linha de dados
            if (lines.length < 3) return;
    
            // Verifica se a primeira linha parece uma linha de tabela
            if (!lines[0].startsWith('|') || !lines[0].endsWith('|')) return;
    
            // Verifica a linha separadora (ex.: |---|---| ou |:---|:---:|)
            const separator = lines[1];
            if (!separator.includes('|')) return;
            const sepCells = separator.split('|')
                .map(function(c) { return c.trim(); })
                .filter(function(c) { return c.length > 0; });
            if (!sepCells.every(function(c) { return /^:?-+:?$/.test(c); })) return;
    
            // Função para dividir uma linha em células
            function parseRow(line) {
                let cells = line.split('|');
                if (cells[0].trim() === '') cells.shift();
                if (cells[cells.length - 1].trim() === '') cells.pop();
                return cells.map(function(c) { return c.trim(); });
            }
    
            // Converte **negrito** em <strong>
            function formatCell(text) {
                return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }
    
            // Monta a tabela HTML
            const table = document.createElement('table');
            table.className = 'lesson-table';
    
            // Cabeçalho
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            parseRow(lines[0]).forEach(function(h) {
                const th = document.createElement('th');
                th.innerHTML = formatCell(h);
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);
    
            // Corpo
            const tbody = document.createElement('tbody');
            lines.slice(2).forEach(function(line) {
                const tr = document.createElement('tr');
                parseRow(line).forEach(function(cell) {
                    const td = document.createElement('td');
                    td.innerHTML = formatCell(cell);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
    
            // Substitui o bloco original pela tabela
            block.replaceWith(table);
        });
    });
    </script>
<script>
    (function () {
        const deck = document.querySelector('.lesson-deck');
        if (!deck) return;
        const slides = Array.from(deck.querySelectorAll('.lesson-slide'));
        const tabs = Array.from(deck.querySelectorAll('.lesson-deck-tab'));
        const key = 'aula-slide-' + location.pathname;
        let index = Math.min(Number(localStorage.getItem(key)) || 0, slides.length - 1);

        function show(i) {
            index = Math.max(0, Math.min(i, slides.length - 1));
            slides.forEach((s, k) => { s.hidden = k !== index; });
            tabs.forEach((t, k) => t.classList.toggle('is-current', k === index));
            document.getElementById('slidePrev').disabled = index === 0;
            document.getElementById('slideNext').disabled = index === slides.length - 1;
            localStorage.setItem(key, index);
        }
        function go(i) { show(i); deck.scrollIntoView({behavior: 'smooth', block: 'start'}); }
        tabs.forEach((t, k) => t.addEventListener('click', () => go(k)));
        document.getElementById('slidePrev').addEventListener('click', () => go(index - 1));
        document.getElementById('slideNext').addEventListener('click', () => go(index + 1));
        document.addEventListener('keydown', function (e) {
            const t = e.target;
            if (e.ctrlKey || e.metaKey || e.altKey || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable) return;
            if (e.key === 'ArrowRight') { go(index + 1); } else if (e.key === 'ArrowLeft') { go(index - 1); }
        });

        // Questoes de fixacao: mesmo comportamento do quiz (clicar responde e mostra o porque).
        const quizId = deck.dataset.quiz;
        const cards = Array.from(deck.querySelectorAll('.lesson-question'));
        function score() {
            const done = cards.filter(c => c.dataset.selected);
            const right = done.filter(c => c.dataset.selected === c.dataset.correct).length;
            document.getElementById('deckScore').textContent = cards.length === 0 ? ''
                : 'Fixação: ' + right + ' de ' + done.length + ' certas' + (done.length < cards.length ? ' · ' + (cards.length - done.length) + ' faltando' : '');
        }
        function reveal(card) {
            const selected = card.dataset.selected, correct = card.dataset.correct;
            card.classList.add('is-answered');
            card.querySelectorAll('.quiz-option').forEach(function (opt) {
                const letter = opt.dataset.letter;
                opt.classList.toggle('is-correct', letter === correct);
                opt.classList.toggle('is-wrong', letter === selected && selected !== correct);
                opt.classList.toggle('is-open', letter === selected || letter === correct);
                opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
            });
        }
        cards.forEach(function (card) {
            if (card.dataset.selected) { reveal(card); }
            card.querySelectorAll('.quiz-option').forEach(function (opt) {
                opt.addEventListener('click', function () {
                    if (card.dataset.selected) {
                        opt.classList.toggle('is-open');
                        opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
                        return;
                    }
                    if (card.dataset.sending) return;
                    card.dataset.sending = '1';
                    fetch('/quizzes/' + quizId + '/responder', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({questionId: Number(card.dataset.id), selected: opt.dataset.letter})
                    }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (res) {
                        card.dataset.selected = opt.dataset.letter;
                        card.dataset.correct = res.correctAnswer;
                        reveal(card);
                        score();
                    }).catch(() => window.p2qToast('Não foi possível salvar a resposta. Tente de novo.', 'danger'))
                      .finally(() => { delete card.dataset.sending; });
                });
            });
        });
        show(index);
        score();
    })();
</script>
</body>
</html>
