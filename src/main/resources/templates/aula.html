<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${lesson.title})}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page lesson-page">
    <a href="/aulas" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Aulas</a>
    <h1 class="mt-1" th:text="${lesson.title}"></h1>
    <p class="page-subtitle">
        <span th:if="${lesson.subject != null}" th:text="${lesson.subject}"></span>
        <span th:if="${lesson.editalTopic != null}" th:text="' · Edital: ' + ${lesson.editalTopic}"></span>
    </p>

    <article class="card p-4 rich-text lesson-content" th:utext="${contentHtml}"></article>

    <!-- Quiz: clicar numa alternativa responde; aparece por que ela esta certa ou errada e, se errou, qual era a certa.
         Depois de responder, clicar nas outras mostra a explicacao delas. -->
    <section id="quiz" class="mt-4" th:unless="${questions.isEmpty()}">
        <div class="d-flex align-items-baseline justify-content-between mb-2">
            <h2 class="h4 m-0">Quiz</h2>
            <span class="small text-muted" id="quizScore"></span>
        </div>
        <div class="card p-4 mb-3 quiz-question" th:each="q : ${questions}" th:attr="data-id=${q.id},data-correct=${answers[q.id] != null} ? ${q.correctAnswer} : '',data-selected=${answers[q.id] != null} ? ${answers[q.id].selectedAnswer} : ''">
            <div class="small text-muted mb-1" th:text="${q.position} + ' de ' + ${questions.size()} + (${q.topic != null} ? ' · ' + ${q.topic} : '')"></div>
            <div class="quiz-statement" th:text="${q.statement}"></div>
            <div class="quiz-options">
                <button type="button" class="quiz-option" th:each="a : ${q.alternativeList()}" th:attr="data-letter=${a.letra}">
                    <span class="alt-letter" th:text="${a.letra}"></span>
                    <span class="quiz-option-body">
                        <span th:text="${a.texto}"></span>
                        <span class="quiz-why" hidden th:text="${a.explicacao}"></span>
                    </span>
                </button>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="small text-muted">Errou algo? No Claude Code, peça para revisar o resultado: ele agenda o reforço.</span>
            <form method="post" th:action="@{/aulas/{id}/refazer(id=${lesson.id})}">
                <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise me-1"></i>Refazer quiz</button>
            </form>
        </div>
    </section>
    <div class="empty-state mt-4" th:if="${questions.isEmpty()}">
        <i class="bi bi-ui-checks"></i><span>Esta aula ainda não tem quiz.</span>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:inline="javascript">
    const lessonId = /*[[${lesson.id}]]*/ 0;
    const cards = Array.from(document.querySelectorAll('.quiz-question'));

    function score() {
        const done = cards.filter(c => c.dataset.selected);
        const right = done.filter(c => c.dataset.selected === c.dataset.correct).length;
        document.getElementById('quizScore').textContent = done.length === 0 ? cards.length + ' perguntas'
            : right + ' de ' + done.length + ' certas' + (done.length < cards.length ? ' · ' + (cards.length - done.length) + ' faltando' : '');
    }

    /** Mostra o resultado: a escolhida (certa/errada) com o porquê e a correta destacada. */
    function reveal(card, focus) {
        const selected = card.dataset.selected, correct = card.dataset.correct;
        card.classList.add('is-answered');
        card.querySelectorAll('.quiz-option').forEach(function (opt) {
            const letter = opt.dataset.letter;
            opt.classList.toggle('is-correct', letter === correct);
            opt.classList.toggle('is-wrong', letter === selected && selected !== correct);
            opt.classList.toggle('is-open', letter === (focus || selected) || (letter === correct && selected !== correct));
            opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
        });
    }

    cards.forEach(function (card) {
        if (card.dataset.selected) { reveal(card); }
        card.querySelectorAll('.quiz-option').forEach(function (opt) {
            opt.addEventListener('click', function () {
                if (card.dataset.selected) {
                    // ja respondida: abrir/fechar a explicacao desta alternativa
                    opt.classList.toggle('is-open');
                    opt.querySelector('.quiz-why').hidden = !opt.classList.contains('is-open');
                    return;
                }
                if (card.dataset.sending) { return; }
                card.dataset.sending = '1';
                fetch('/aulas/' + lessonId + '/responder', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({questionId: Number(card.dataset.id), selected: opt.dataset.letter})
                }).then(function (r) {
                    if (!r.ok) { throw new Error(r.status); }
                    return r.json();
                }).then(function (res) {
                    card.dataset.selected = opt.dataset.letter;
                    card.dataset.correct = res.correctAnswer;
                    reveal(card);
                    score();
                }).catch(function () {
                    alert('Não foi possível salvar a resposta. Tente de novo.');
                }).finally(function () { delete card.dataset.sending; });
            });
        });
    });
    score();
</script>
</body>
</html>
