<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cronograma')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Cronograma</h1>
            <p class="page-subtitle">Planeje o que estudar em cada dia e acompanhe o tempo que você realmente dedicou.</p>
        </div>
    </div>
    <nav th:replace="~{fragments/estudos :: tabs('schedule')}"></nav>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <form method="post" action="/estudos/cronograma" class="card p-3 mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label small" for="taskTitle">Nova tarefa</label>
                <input type="text" name="title" id="taskTitle" class="form-control" required maxlength="255"
                       placeholder="Ex.: Ler Lei 8.112 – arts. 1 a 50"/>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Dia</label>
                <input type="date" name="plannedDate" class="form-control" th:value="${today}"/>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small">Disciplina</label>
                <input type="text" name="subject" class="form-control" list="subjectOptions"/>
            </div>
            <div class="col-6 col-md-1">
                <label class="form-label small">Minutos</label>
                <input type="number" name="estimatedMinutes" class="form-control" min="0" step="5" placeholder="60"/>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Adicionar</button>
            </div>
        </div>
        <textarea name="description" class="form-control form-control-sm mt-2 task-desc-new" rows="1"
                  placeholder="Descrição (opcional): o que estudar, links, observações…"></textarea>
        <details class="mt-2">
            <summary class="small text-muted">Página de resumo</summary>
            <div class="row g-2 mt-1">
                <div class="col-md-5">
                    <select name="pageId" class="form-select form-select-sm">
                        <option value="">Sem página de resumo</option>
                        <option th:each="n : ${pages}" th:value="${n.page.id}" th:text="${#strings.repeat('— ', n.depth)} + ${n.page.displayTitle}"></option>
                    </select>
                </div>
            </div>
        </details>
    </form>
    <datalist th:replace="~{fragments/estudos :: subjects}"></datalist>

    <div class="row row-cols-3 g-3 mb-4" th:unless="${groups.isEmpty()}">
        <div class="col"><div th:replace="~{fragments/ui :: stat('Tarefas da semana', ${week.done} + ' de ' + ${week.planned}, '')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Planejado na semana', ${week.estimatedMinutes} + ' min', '')}"></div></div>
        <div class="col"><div th:replace="~{fragments/ui :: stat('Estudado na semana', ${week.spentMinutes} + ' min', 'text-ok')}"></div></div>
    </div>

    <div th:if="${groups.isEmpty()}" class="empty-state">
        <i class="bi bi-calendar-check"></i>
        <span>Nenhuma tarefa ainda. Escreva o que vai estudar acima, escolha o dia e clique em <strong>Adicionar</strong>.</span>
    </div>

    <div class="d-flex justify-content-end mb-2 small" th:if="${hiddenDays > 0 or showAll}">
        <a th:if="${!showAll}" href="/estudos/cronograma?ver=todas" th:text="'Mostrar dias anteriores já concluídos (' + ${hiddenDays} + ')'"></a>
        <a th:if="${showAll}" href="/estudos/cronograma">Ocultar dias antigos já concluídos</a>
    </div>

    <th:block th:each="g : ${groups}">
    <details class="mb-3" th:open="${g.kind != 'past' or g.doneCount() < g.tasks.size()}">
        <summary class="day-header">
            <span class="section-title m-0" th:classappend="${g.kind == 'overdue'} ? 'text-bad' : ''" th:text="${g.label}"></span>
            <span class="text-muted small" th:text="(${g.doneCount() > 0} ? ${g.doneCount()} + ' de ' + ${g.tasks.size()} + (${g.doneCount() == 1} ? ' concluída' : ' concluídas') : ${g.tasks.size()} + (${g.tasks.size() == 1} ? ' tarefa' : ' tarefas')) + (${g.estimatedMinutes() > 0} ? ' · ' + (${g.spentMinutes() > 0} ? ${g.spentMinutes()} + ' de ' : '') + ${g.estimatedMinutes()} + ' min' : (${g.spentMinutes() > 0} ? ' · ' + ${g.spentMinutes()} + ' min' : ''))"></span>
            <form th:if="${g.kind == 'overdue' and overdueFirst == g.date}" method="post" action="/estudos/cronograma/atrasadas/hoje"
                  class="ms-2" onclick="event.stopPropagation()">
                <button type="submit" class="btn btn-sm btn-outline-secondary py-0">Trazer atrasadas para hoje</button>
            </form>
            <span class="ms-auto" th:if="${g.date != null}">
                <th:block th:replace="~{fragments/estudos :: dayButton(${g.date}, ${summaries[g.date]}, ${summaries[g.date] != null} ? 'Abrir resumo' : 'Resumo do dia', '')}"></th:block>
            </span>
        </summary>
        <div class="card task-list mt-2">
            <div class="task-row" th:each="t : ${g.tasks}" th:classappend="${t.done} ? 'is-done'">
                <form th:replace="~{fragments/estudos :: taskCheck(${t})}"></form>
                <div class="task-info">
                    <a class="text-reset text-decoration-none fw-medium" th:href="@{/estudos/cronograma/{id}/editar(id=${t.id})}" th:text="${t.title}"></a>
                    <div class="task-meta">
                        <span th:if="${t.subject != null}" class="fw-medium" th:text="${t.subject}"></span>
                        <form th:replace="~{fragments/estudos :: taskTime(${t})}"></form>
                        <a th:if="${t.pageId != null}" th:href="@{/estudos/paginas/{id}(id=${t.pageId})}"><i class="bi bi-file-earmark-text"></i> material</a>
                    </div>
                    <div class="small text-muted text-truncate" th:if="${t.review and t.listDescription != null}" th:text="${t.listDescription}"></div>
                    <form th:replace="~{fragments/estudos :: taskDescription(${t})}"></form>
                </div>
                <div class="dropdown">
                    <button type="button" class="icon-btn border-0" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mais ações"><i class="bi bi-three-dots"></i></button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/estudos/cronograma/{id}/editar(id=${t.id})}"><i class="bi bi-pencil me-2"></i>Editar</a></li>
                        <th:block th:if="${!t.review and !t.done}">
                            <li th:if="${t.plannedDate == null or !t.plannedDate.equals(today)}">
                                <form method="post" th:action="@{/estudos/cronograma/{id}/adiar(id=${t.id}, para=${today})}">
                                    <button type="submit" class="dropdown-item"><i class="bi bi-calendar-event me-2"></i>Fazer hoje</button>
                                </form>
                            </li>
                            <li>
                                <form method="post" th:action="@{/estudos/cronograma/{id}/adiar(id=${t.id}, para=${(t.plannedDate != null and t.plannedDate.isAfter(today) ? t.plannedDate : today).plusDays(1)})}">
                                    <button type="submit" class="dropdown-item"><i class="bi bi-calendar-plus me-2"></i>Adiar 1 dia</button>
                                </form>
                            </li>
                        </th:block>
                        <li th:unless="${t.review}">
                            <form method="post" th:action="@{/estudos/cronograma/{id}/revisao(id=${t.id}, ativa=${!t.reviewEnabled})}">
                                <button type="submit" class="dropdown-item">
                                    <i class="bi bi-arrow-repeat me-2"></i><span
                                        th:text="${t.reviewEnabled} ? 'Não revisar este assunto' : 'Revisar este assunto'"></span></button>
                            </form>
                        </li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form method="post" th:action="@{/estudos/cronograma/{id}/excluir(id=${t.id})}" onsubmit="return confirm('Apagar esta tarefa?')">
                                <button type="submit" class="dropdown-item text-bad"><i class="bi bi-trash me-2"></i>Apagar</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </details>
    </th:block>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
