<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Simulado')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <h1 class="mb-4">Simulado (Edital Dataprev)</h1>
    <p class="text-muted">
        Conhecimentos Gerais valem peso 1 e Conhecimentos Específicos valem peso 2,5 no cálculo da nota final.
    </p>

    <form method="post" action="/simulado/iniciar" class="card p-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Quantidade — Conhecimentos Gerais</label>
                <input type="number" name="qtyGerais" class="form-control" value="10" min="0" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Quantidade — Conhecimentos Específicos</label>
                <input type="number" name="qtyEspecificas" class="form-control" value="10" min="0" required/>
            </div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" name="keepExamOrder" value="true" id="keepExamOrder"/>
            <label class="form-check-label" for="keepExamOrder">
                Manter ordem original da prova (também agrupa por disciplina)
            </label>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar Simulado</button>
    </form>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
