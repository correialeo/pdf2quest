<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Simulado')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Simulado</h1>
            <p class="page-subtitle">Modelo do edital Dataprev: Conhecimentos Gerais valem peso 1 e Específicos, peso 2,5 na nota final.
                Para outras provas, use um bloco com perfil de pontuação.</p>
        </div>
    </div>

    <form method="post" action="/simulado/iniciar" class="card p-4 form-narrow">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Conhecimentos Gerais</label>
                <input type="number" name="qtyGerais" class="form-control" value="10" min="0" required/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Conhecimentos Específicos</label>
                <input type="number" name="qtyEspecificas" class="form-control" value="10" min="0" required/>
            </div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" name="keepExamOrder" value="true" id="keepExamOrder"/>
            <label class="form-check-label" for="keepExamOrder">
                Manter ordem original da prova (também agrupa por disciplina)
            </label>
        </div>
        <button type="submit" class="btn btn-primary align-self-start"><i class="bi bi-play-fill me-1"></i>Iniciar simulado</button>
    </form>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
