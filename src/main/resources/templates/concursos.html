<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Concursos')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Concursos</h1>
            <p class="page-subtitle">Cada concurso é um workspace: escolha um na barra lateral e o cronograma, as aulas,
                os simulados e o desempenho mostram só o dele.</p>
        </div>
        <a href="/concursos/novo" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo concurso</a>
    </div>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <th:block th:if="${concursos.isEmpty()}">
        <div th:replace="~{fragments/ui :: empty('bi-briefcase', 'Nenhum concurso ainda. Cadastre o primeiro para separar cronograma, aulas e simulados por concurso.', 'Novo concurso', '/concursos/novo')}"></div>
    </th:block>

    <div class="row row-cols-1 row-cols-lg-2 g-3">
        <div class="col" th:each="c : ${concursos}">
            <div class="card p-3 h-100 concurso-card" th:style="'--concurso-cor:' + ${c.corOuPadrao}"
                 th:classappend="${c.arquivado} ? 'opacity-75'">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <h5 class="mb-0"><a class="text-reset text-decoration-none" th:href="@{/concursos/{id}(id=${c.id})}" th:text="${c.nome}"></a></h5>
                        <div class="text-muted small" th:text="${#strings.listJoin(#lists.toList({c.orgao, c.cargo, c.banca}).?[#this != null], ' · ')}"></div>
                    </div>
                    <span class="badge text-bg-light border" th:text="${c.status.label}"></span>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-2 small">
                    <span th:if="${c.dataProva != null}">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${#temporals.format(c.dataProva, 'dd/MM/yyyy')}"></span>
                        <strong th:with="d=${c.diasParaProva(today)}"
                                th:text="${d > 0} ? '· faltam ' + ${d} + ' dias' : (${d == 0} ? '· é hoje' : '· já foi')"></strong>
                    </span>
                    <span th:if="${c.dataInscricaoFim != null and !c.dataInscricaoFim.isBefore(today)}" class="text-guess">
                        <i class="bi bi-pencil me-1"></i>inscrições até <span th:text="${#temporals.format(c.dataInscricaoFim, 'dd/MM')}"></span>
                    </span>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-2 small text-muted" th:if="${homes[c.id] != null}" th:with="h=${homes[c.id]}">
                    <span th:text="${h.semana.done} + ' de ' + ${h.semana.planned} + ' tarefas na semana'"></span>
                    <span th:unless="${h.simulados.isEmpty()}"
                          th:text="'último simulado: ' + (${h.simulados[h.simulados.size() - 1].nota} ?: '–') + ' pts'"></span>
                    <span th:if="${h.editalTopicos() > 0}" th:text="${h.editalEstudados()} + '/' + ${h.editalTopicos()} + ' tópicos do edital'"></span>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <form method="post" action="/workspace" th:unless="${c.arquivado}">
                        <input type="hidden" name="concurso" th:value="${c.id}"/>
                        <button type="submit" class="btn btn-sm btn-outline-primary"
                                th:disabled="${concursoAtivo != null and concursoAtivo.id == c.id}"
                                th:text="${concursoAtivo != null and concursoAtivo.id == c.id} ? 'Ativo' : 'Usar este'"></button>
                    </form>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/concursos/{id}/editar(id=${c.id})}">Editar</a>
                    <form method="post" th:action="@{/concursos/{id}/arquivar(id=${c.id})}">
                        <input type="hidden" name="arquivar" th:value="${!c.arquivado}"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${c.arquivado} ? 'Reabrir' : 'Arquivar'"></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
