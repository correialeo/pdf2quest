<!-- Componentes de tela reaproveitados por todas as paginas. -->

<!-- Cabecalho da pagina: use a marcacao direto (div.page-header > div > h1 + p.page-subtitle, acoes a direita). -->

<!-- Mensagens de sucesso/erro vindas de redirect (flash attributes "message" e "error"). -->
<th:block th:fragment="flash">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</th:block>

<!-- Cartao de metrica: rotulo pequeno em cima, numero grande embaixo. -->
<div th:fragment="stat(label, value, cls)" class="card stat">
    <div class="stat-label" th:text="${label}"></div>
    <div class="stat-value" th:classappend="${cls}" th:text="${value}"></div>
</div>

<!-- Estado vazio: icone, texto e um link opcional para a proxima acao. -->
<div th:fragment="empty(icon, text, linkText, linkHref)" class="empty-state">
    <i class="bi" th:classappend="${icon}"></i>
    <span th:text="${text}"></span>
    <a th:if="${linkHref != null}" th:href="${linkHref}" th:text="${linkText}" class="ms-1"></a>
</div>

<!-- Questao para leitura (listas de prova, bloco, erros e chutes): cabecalho, texto base opcional, enunciado e
     alternativas. "correct"/"wrong" sao letras a destacar (null = nao destacar); "tools" mostra a observacao editavel. -->
<article th:fragment="question(q, heading, passage, passageOpen, correct, wrong, tools)" class="card question-card">
    <header class="question-card-head">
        <span class="fw-medium" th:text="${heading}"></span>
        <span class="text-muted small" th:if="${q.subject != null}" th:text="${q.subject}"></span>
        <span class="text-muted small ms-auto" th:if="${q.organization != null or q.year != null}"
              th:text="${#strings.defaultString(q.organization, '')} + (${q.organization != null and q.year != null} ? ' · ' : '') + ${q.year != null ? q.year : ''}"></span>
    </header>
    <details class="mb-3" th:if="${passage != null}" th:open="${passageOpen}">
        <summary class="small text-muted">Texto base</summary>
        <div class="rich-text mt-2 passage-inline" th:utext="${@richText.html(passage.content)}"></div>
    </details>
    <div class="rich-text mb-3" th:utext="${@richText.html(q.statement)}"></div>
    <div th:each="alt : ${q.alternatives()}" class="review-alt"
         th:classappend="${alt.key == correct} ? 'is-correct' : (${alt.key == wrong} ? 'is-wrong' : '')">
        <strong th:text="${alt.key} + ')'"></strong> <span class="rich-text" th:utext="${@richText.html(alt.value)}"></span>
        <span class="alt-tag text-ok" th:if="${alt.key == correct}">Resposta certa</span>
        <span class="alt-tag text-bad" th:if="${alt.key == wrong}">Sua resposta</span>
    </div>
    <p class="text-muted small mt-3 mb-0" th:if="${!tools and q.note != null}" th:text="'Observação: ' + ${q.note}"></p>
    <th:block th:if="${tools}"><div th:replace="~{fragments/question-tools :: tools(${q})}"></div></th:block>
</article>
