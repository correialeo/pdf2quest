<div th:fragment="preview(preview)" class="card p-3 mb-4">
    <div class="d-flex flex-wrap align-items-baseline gap-2 mb-3">
        <span class="stat-value" th:text="${preview.total}"></span>
        <span class="text-muted">questões</span>
        <span class="text-muted small" th:if="${preview.excluded > 0}"
              th:text="'· ' + ${preview.excluded} + ' excluídas pelo bloco'"></span>
    </div>
    <div class="row g-4">
        <div class="col-md-7" th:if="${!preview.bySubject.isEmpty()}">
            <div class="stat-label">Por disciplina</div>
            <table class="table table-sm mb-0">
                <tbody>
                <tr th:each="e : ${preview.bySubject}">
                    <td th:text="${e.key}"></td>
                    <td class="text-end text-muted" th:text="${e.value}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-5">
            <div class="stat-label">Por origem</div>
            <table class="table table-sm mb-0">
                <tbody>
                <tr th:each="s : ${preview.perSource}">
                    <td th:text="${s.label}"></td>
                    <td class="text-end text-muted" th:text="${s.count}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="alert alert-warning mt-3 mb-0" th:if="${!preview.warnings.isEmpty()}">
        <div th:each="w : ${preview.warnings}" th:text="${w}"></div>
    </div>
    <div class="alert alert-warning mt-3 mb-0" th:if="${!preview.unweightedSubjects.isEmpty()}">
        Disciplinas sem peso no perfil de pontuação (não valem ponto):
        <span th:each="e, st : ${preview.unweightedSubjects}"
              th:text="${e.key} + ' (' + ${e.value} + ')' + (${st.last} ? '' : ', ')"></span>
    </div>
</div>
