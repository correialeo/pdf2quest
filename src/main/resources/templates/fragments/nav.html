<th:block th:fragment="nav">

            aria-controls="sidebar" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
    <a class="sidebar-brand p-0" href="/dashboard"><span>PDF2Questao</span></a>
</header>

<aside class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1" aria-label="Menu">
    <div class="sidebar-inner">
        <div class="sidebar-top">
            <a class="sidebar-brand" href="/dashboard"><span class="sidebar-label">PDF2Questao</span></a>

        <div class="sidebar-section">Estudar</div>
        <a class="sidebar-link" href="/blocos" title="Blocos de estudo"><i class="bi bi-collection"></i><span class="sidebar-label">Blocos de estudo</span></a>
        <a class="sidebar-link" href="/questoes" title="Sessão rápida"><i class="bi bi-lightning"></i><span class="sidebar-label">Sessão rápida</span></a>
        <a class="sidebar-link" href="/simulado" title="Simulado"><i class="bi bi-stopwatch"></i><span class="sidebar-label">Simulado</span></a>

        <div class="sidebar-section">Estudos</div>

        <div class="sidebar-section">Revisar</div>
        <a class="sidebar-link" href="/caderno-erros" title="Caderno de erros"><i class="bi bi-journal-x"></i><span class="sidebar-label">Caderno de erros</span></a>

        <a class="sidebar-link" href="/import" title="Importar PDF"><i class="bi bi-file-earmark-arrow-up"></i><span class="sidebar-label">Importar PDF</span></a>

            <a class="sidebar-link" href="/perfis" title="Perfis de pontuação"><i class="bi bi-sliders"></i><span class="sidebar-label">Perfis de pontuação</span></a>

<!-- Erro vindo de outra tela (ex.: filtros sem questoes): aparece por cima de qualquer pagina. -->
<div class="alert alert-danger alert-dismissible global-alert" role="alert" th:if="${globalError}">
    <span th:text="${globalError}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>
</th:block>
