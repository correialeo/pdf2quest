<!-- Pecas compartilhadas pelas telas da area de Estudos. -->

<!-- Abas do topo: active = overview | pages | schedule | inbox. -->
<nav th:fragment="tabs(active)" class="study-tabs" aria-label="Estudos">
    <a href="/hoje" th:classappend="${active == 'overview'} ? 'active'"><i class="bi bi-sun"></i> Hoje</a>
    <a href="/estudos/paginas" th:classappend="${active == 'pages'} ? 'active'"><i class="bi bi-file-earmark-text"></i> Páginas e resumos</a>
    <a href="/estudos/cronograma" th:classappend="${active == 'schedule'} ? 'active'"><i class="bi bi-calendar-check"></i> Cronograma</a>
    <a href="/estudos/cronogramas" th:classappend="${active == 'schedules'} ? 'active'"><i class="bi bi-calendar-range"></i> Cronogramas</a>
    <a href="/estudos/caixa-de-entrada" th:classappend="${active == 'inbox'} ? 'active'"><i class="bi bi-inbox"></i> Caixa de entrada</a>
</nav>

<!-- Sugestoes para os campos de disciplina (o usuario pode digitar outra). -->
<datalist th:fragment="subjects" id="subjectOptions">
    <option th:each="s : ${subjects}" th:value="${s}"></option>
</datalist>

<!-- Anotacao rapida: vai para a caixa de entrada sem escolher nada. -->
<form th:fragment="quickNote" method="post" action="/estudos/caixa-de-entrada" class="quick-note">
    <textarea name="content" class="form-control" rows="2" required
              placeholder="Anote rápido: uma dúvida, um artigo para revisar, uma ideia… (Ctrl+Enter guarda)"></textarea>
    <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-inbox me-1"></i>Guardar</button>
</form>

<!-- Botao do resumo de um dia: abre o que ja existe ou cria na primeira vez. "label" vazio = so o icone. -->
<th:block th:fragment="dayButton(date, pageId, label, cls)">
    <a th:if="${pageId != null}" th:href="@{/estudos/paginas/{id}(id=${pageId})}" class="day-summary-btn has-summary" th:classappend="${cls}"
       title="Abrir o resumo deste dia" onclick="event.stopPropagation()">
        <i class="bi bi-journal-text"></i><span th:if="${label != ''}" th:text="${label}"></span></a>
    <form th:unless="${pageId != null}" method="post" th:action="@{/estudos/cronograma/dia/{d}/resumo(d=${date})}" class="d-inline">
        <button type="submit" class="day-summary-btn" th:classappend="${cls}" title="Escrever o resumo deste dia" onclick="event.stopPropagation()">
            <i class="bi bi-journal-plus"></i><span th:if="${label != ''}" th:text="${label}"></span></button>
    </form>
</th:block>

<!-- Concluir/reabrir. Ao concluir, o app.js pergunta os minutos (ja preenchidos com o estimado). -->
<form th:fragment="taskCheck(t)" method="post" th:action="@{/estudos/cronograma/{id}/concluir(id=${t.id})}" class="task-done-form"
      th:attr="data-done=${t.done},data-estimate=${t.estimatedMinutes},data-spent=${t.spentMinutes},data-title=${t.title},data-task=${t.id}">
    <input type="hidden" name="done" th:value="${!t.done}"/>
    <input type="hidden" name="spentMinutes" value=""/>
    <button type="submit" class="task-check" th:title="${t.done} ? 'Reabrir' : 'Concluir'"
            th:attr="aria-label=${t.done} ? 'Reabrir tarefa' : 'Concluir tarefa'">
        <i class="bi" th:classappend="${t.done} ? 'bi-check-circle-fill' : 'bi-circle'"></i></button>
</form>

<!-- Sequencia da tarefa: Aula -> Quiz -> Concluir, com o passo atual destacado (f: TodayFlowService.Flow). -->
<ol th:fragment="flowSteps(f, currentKind, currentId)" class="flow-steps" th:if="${f.hasLinked()}">
    <li th:each="s : ${f.steps}"
        th:classappend="${s.done} ? 'is-done' : (${s == f.action} ? 'is-next' : '')"
        th:attr="aria-current=${currentKind == s.kind and currentId == s.id} ? 'step' : null">
        <a th:href="${s.link}" th:title="${s.title}">
            <i class="bi" th:classappend="${s.done} ? 'bi-check-circle-fill' : (${s.kind == 'aula'} ? 'bi-easel' : 'bi-ui-checks')"></i>
            <span th:text="${s.kind == 'aula'} ? 'Aula' : 'Quiz'"></span><span class="flow-step-detail"
                  th:if="${s.detail != null}" th:text="' · ' + ${#strings.replace(s.detail, 'em andamento · ', '')}"></span></a>
    </li>
    <li th:classappend="${f.task.done} ? 'is-done' : (${f.action.kind == 'concluir'} ? 'is-next' : '')">
        <span><i class="bi" th:classappend="${f.task.done} ? 'bi-check-circle-fill' : 'bi-flag'"></i> Concluir</span>
    </li>
</ol>

<!-- Botao principal da tarefa: o proximo passo (aula/quiz) ou concluir. A aula ja lida no navegador vira "Fazer quiz". -->
<th:block th:fragment="flowAction(f, size)">
    <a th:if="${f.action.link != null}" th:href="${f.action.link}" class="btn btn-primary flow-action" th:classappend="${size}"
       th:attr="data-lesson=${f.action.kind == 'aula'} ? ${f.action.id} : null,
                data-after-link=${f.action.kind == 'aula' and f.pendingQuiz() != null} ? ${f.pendingQuiz().link} : null,
                data-after-label=${f.action.kind == 'aula' and f.pendingQuiz() != null} ? ${f.pendingQuiz().label} : null">
        <i class="bi me-1" th:classappend="${f.action.kind == 'aula'} ? 'bi-easel' : 'bi-ui-checks'"></i><span th:text="${f.action.label}"></span></a>
    <th:block th:if="${f.action.kind == 'concluir' and !f.task.done}"><form th:replace="~{fragments/estudos :: taskDoneButton(${f.task})}"></form></th:block>
</th:block>

<!-- Botao "Concluir tarefa" (aula, quiz): abre o mesmo dialogo de minutos do cronograma. -->
<form th:fragment="taskDoneButton(t)" method="post" th:action="@{/estudos/cronograma/{id}/concluir(id=${t.id})}"
      class="task-done-form d-inline" th:attr="data-done=${t.done},data-estimate=${t.estimatedMinutes},data-spent=${t.spentMinutes},data-title=${t.title},data-task=${t.id}">
    <input type="hidden" name="done" value="true"/>
    <input type="hidden" name="spentMinutes" value=""/>
    <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check2-circle me-1"></i>Concluir tarefa</button>
</form>

<!-- Concluir e seguir: conclui (com o tempo do cronometro) e abre o proximo passo da fila ("voltar"). -->
<form th:fragment="taskDoneAndGo(t, go, label)" method="post" th:action="@{/estudos/cronograma/{id}/concluir(id=${t.id})}"
      class="task-done-form d-inline" th:attr="data-done=${t.done},data-estimate=${t.estimatedMinutes},data-spent=${t.spentMinutes},data-title=${t.title},data-task=${t.id}">
    <input type="hidden" name="done" value="true"/>
    <input type="hidden" name="spentMinutes" value=""/>
    <input type="hidden" name="voltar" th:value="${go}"/>
    <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check2-circle me-1"></i><span th:text="${label}"></span></button>
</form>

<!-- Tempo da tarefa ("45 de 60 min"); clicar corrige os minutos dedicados. -->
<form th:fragment="taskTime(t)" method="post" th:action="@{/estudos/cronograma/{id}/tempo(id=${t.id})}" class="task-time-form d-inline"
      th:attr="data-estimate=${t.estimatedMinutes},data-spent=${t.spentMinutes},data-title=${t.title}">
    <input type="hidden" name="spentMinutes" th:value="${t.spentMinutes}"/>
    <button type="submit" class="task-time" title="Alterar os minutos estudados">
        <i class="bi bi-clock"></i>
        <span th:if="${t.spentMinutes != null}" th:text="${t.spentMinutes} + (${t.estimatedMinutes != null} ? ' de ' + ${t.estimatedMinutes} : '') + ' min'"></span>
        <span th:if="${t.spentMinutes == null and t.estimatedMinutes != null}" th:text="${t.estimatedMinutes} + ' min'"></span>
        <span th:if="${t.spentMinutes == null and t.done}" class="text-warn">· sem tempo</span>
        <span th:if="${t.spentMinutes == null and t.estimatedMinutes == null and !t.done}">tempo</span>
    </button>
</form>

<!-- Descricao da tarefa: clicar edita ali mesmo (Enter ou clicar fora salva, Shift+Enter quebra linha, Esc cancela). -->
<!-- Aulas e quizzes ligados a tarefa, com andamento (items: List<LessonService.Linked>, pode ser null). -->
<ul th:fragment="taskLinked(items)" th:if="${items != null and !items.isEmpty()}" class="task-linked">
    <li th:each="l : ${items}">
        <i class="bi" th:classappend="${l.concluido} ? 'bi-check-circle-fill text-ok' : (${l.tipo == 'Aula'} ? 'bi-journal-text' : 'bi-patch-question')"></i>
        <a th:href="${l.link}" th:text="${l.tipo} + ': ' + ${l.titulo}"></a>
        <span class="text-muted" th:text="'· ' + ${l.andamento}"></span>
    </li>
</ul>

<form th:fragment="taskDescription(t)" th:unless="${t.review}" method="post" th:action="@{/estudos/cronograma/{id}/descricao(id=${t.id})}"
      class="task-desc-form">
    <button type="button" class="task-desc" th:classappend="${t.listDescription == null} ? 'is-empty'"
            th:title="${t.listDescription != null} ? ${t.description} : 'Adicionar uma descrição'"
            th:text="${t.listDescription != null} ? ${t.listDescription} : '+ descrição'"></button>
    <textarea name="description" class="form-control form-control-sm" rows="1" hidden aria-label="Descrição da tarefa"
              th:text="${t.description}"></textarea>
</form>
