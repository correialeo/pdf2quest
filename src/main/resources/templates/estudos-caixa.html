<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Caixa de entrada')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-header">
        <div>
            <h1>Caixa de entrada</h1>
            <p class="page-subtitle">Anote agora sem parar o estudo; organize depois, transformando em página ou escolhendo a disciplina.</p>
        </div>
    </div>
    <nav th:replace="~{fragments/estudos :: tabs('inbox')}"></nav>
    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <form th:replace="~{fragments/estudos :: quickNote}"></form>
    <datalist th:replace="~{fragments/estudos :: subjects}"></datalist>

    <div th:if="${notes.isEmpty()}" class="empty-state mt-4">
        <i class="bi bi-inbox"></i>
        <span>Caixa vazia. Tudo organizado!</span>
    </div>

    <div class="d-flex flex-column gap-3 mt-4" th:unless="${notes.isEmpty()}">
        <article class="card p-3 inbox-note" th:each="n : ${notes}">
            <div class="inbox-text" th:text="${n.content}"></div>
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2 small">
                <span class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                <form method="post" th:action="@{/estudos/caixa-de-entrada/{id}/disciplina(id=${n.id})}" class="d-flex gap-1">
                    <input type="text" name="subject" class="form-control form-control-sm" list="subjectOptions"
                           th:value="${n.subject}" placeholder="Disciplina" aria-label="Disciplina" style="width: 12rem"/>
                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Salvar disciplina"><i class="bi bi-check2"></i></button>
                </form>
                <form method="post" th:action="@{/estudos/caixa-de-entrada/{id}/virar-pagina(id=${n.id})}" class="d-flex gap-1 ms-md-auto">
                    <select name="parentId" class="form-select form-select-sm" aria-label="Onde criar a página" style="width: 12rem">
                        <option value="">Nova página principal</option>
                        <option th:each="p : ${pages}" th:value="${p.page.id}" th:text="'Dentro de: ' + ${#strings.repeat('— ', p.depth)} + ${p.page.displayTitle}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary text-nowrap"><i class="bi bi-file-earmark-plus me-1"></i>Virar página</button>
                </form>
                <form method="post" th:action="@{/estudos/caixa-de-entrada/{id}/excluir(id=${n.id})}" onsubmit="return confirm('Apagar esta anotação?')">
                    <button type="submit" class="icon-btn border-0 text-bad" title="Apagar" aria-label="Apagar anotação"><i class="bi bi-trash"></i></button>
                </form>
            </div>
        </article>
    </div>
</main>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
